# Feature-Katalog – Taxonomie (Single Source of Truth zusammen mit features/ und review.yaml).
# Aufbau, Regeln und Pflege: docs/feature-katalog.md
#
# Jeder Funktionsbereich legt unter `owns` fest, welche automatisch erkannten Bestandteile zu ihm
# gehören (Endpunkte als Pfad-Präfix, Ereignisse als Typ-Präfix, Routen, Node-RED-Nodes).
# `status: katalogisiert` heißt: Bestandsaufnahme abgeschlossen – jeder Bestandteil muss einem Feature,
# einem Prüfbestand-Eintrag oder einer Ausnahme zugeordnet sein, sonst schlägt die Prüfung fehl.
schemaVersion: 1

areas:
  - id: lagerstruktur
    title: Lagerstruktur
    summary: Lagerplätze mit Koordinaten, Platztypen und Gruppen abbilden und Plätze oder ganze Bereiche sperren.
    status: katalogisiert
    owns:
      endpoints: [/v1/location-types, /v1/location-groups, /v1/locations]
      events: [location-type, location-group, location]
      uiRoutes: [/lagerplaetze]
    groups:
      - id: lagerstruktur.stammdaten
        title: Plätze, Typen und Bereiche
        summary: Der räumliche Aufbau des Lagers.
      - id: lagerstruktur.sperren
        title: Sperren und Anlagenzustand
        summary: Plätze und Bereiche für Ein- und Auslagerung sperren; Zustand laut Anlage.

  - id: transporteinheiten
    title: Transporteinheiten
    summary: Paletten, Behälter und andere Ladeeinheiten führen, bewegen und stapeln – mit Regeln, wohin sie dürfen.
    status: katalogisiert
    owns:
      endpoints: [/v1/transport-unit-types, /v1/transport-units, /v1/transport-unit-errors]
      events: [transport-unit-type, transport-unit]
      nodeRedNodes: [wms-move-tu]
    groups:
      - id: transporteinheiten.typen
        title: TU-Typen und Regeln
        summary: Ladungsträger und ihre Platzierungs- und Stapelregeln.
      - id: transporteinheiten.fuehrung
        title: Transporteinheiten führen
        summary: Anlegen, prüfen, bewegen, stapeln und finden.

  - id: strategien
    title: Strategien und Regeln
    summary: Konfigurierbare Regelsätze entscheiden über Einlagerplätze und die Auswahl des Bestands bei der Auslagerung.
    status: katalogisiert
    owns:
      endpoints: [/v1/strategies, /v1/strategy-rule-sets, /v1/putaway, /v1/allocation, /v1/strategy-decisions]
      events: [strategy-rule-set, putaway, allocation]
    groups:
      - id: strategien.regelsaetze
        title: Regelsätze und Bedingungen
        summary: Entscheidungen konfigurieren statt programmieren.
      - id: strategien.einlagerung
        title: Einlagerung
        summary: Den passenden Lagerplatz bestimmen.
      - id: strategien.auslagerung
        title: Auslagerung
        summary: Den passenden Bestand für einen Bedarf bestimmen.
      - id: strategien.nachvollziehbarkeit
        title: Nachvollziehbarkeit
        summary: Jede Entscheidung mit Begründung.

  - id: bestand
    title: Bestand
    summary: Bestand je Transporteinheit führen, buchen, reservieren, auswerten und per Inventur prüfen.
    status: katalogisiert
    owns:
      endpoints: [/v1/products, /v1/stock, /v1/stock-reservations, /v1/stock-bookings, /v1/stock-counts]
      events: [product, stock, stock-count]
      uiRoutes: [/bestand]
    groups:
      - id: bestand.stammdaten
        title: Produkte und Einheiten
        summary: Artikelstamm mit Basiseinheit und alternativen Einheiten als Grundlage aller Mengen.
      - id: bestand.bestandsfuehrung
        title: Bestand je Transporteinheit
        summary: Wie Bestand geführt, unterschieden und abgefragt wird.
      - id: bestand.buchungen
        title: Buchungen
        summary: Bestand verändern – Abgang, Umbuchung und Korrektur, sicher auch bei gleichzeitigen Zugriffen.
      - id: bestand.reservierung
        title: Reservierung
        summary: Bestand für einen Zweck zurückhalten, bevor er entnommen wird.
      - id: bestand.auswertung
        title: Auswertung und Nachvollziehbarkeit
        summary: Summen, Journal und die Bestandsansicht im Leitstand.
      - id: bestand.inventur
        title: Inventur
        summary: Bestand einer Transporteinheit zählen und Differenzen nachvollziehbar buchen.

  - id: wareneingang
    title: Wareneingang
    summary: Avisierte und nicht avisierte Ware erfassen und als Bestand auf Transporteinheiten buchen.
    status: katalogisiert
    owns:
      endpoints: [/v1/receiving-orders, /v1/receiving-blind-captures]
      events: [receiving-order, receiving-position, receiving]
      uiRoutes: [/wareneingang]
      nodeRedNodes: [wms-receive]
    groups:
      - id: wareneingang.avis
        title: Avis und Auftrag
        summary: Erwartete Lieferungen und ihr Abschluss.
      - id: wareneingang.erfassung
        title: Erfassung
        summary: Angelieferte Ware als Bestand buchen.

  - id: lagerbewegungen
    title: Lagerbewegungen
    summary: Bewegungen von Transporteinheiten planen, ausführen und mit Abweichungen abschließen.
    status: katalogisiert
    owns:
      endpoints: [/v1/movements, /v1/movement-groups]
      events: [movement, movement-group]
    groups:
      - id: lagerbewegungen.planung
        title: Planung
        summary: Bewegungen anlegen und priorisieren.
      - id: lagerbewegungen.ausfuehrung
        title: Ausführung
        summary: Bewegungen bearbeiten und abschließen.

  - id: transportauftraege
    title: Transportaufträge
    summary: Transporte für die Anlage steuern – mit Startregeln, Unterbrechung, Umleitung und Abschluss.
    status: katalogisiert
    owns:
      endpoints: [/v1/transport-orders]
      events: [transport-order]
      uiRoutes: [/transport]
    groups:
      - id: transportauftraege.steuerung
        title: Steuerung
        summary: Transporte für die Anlage anlegen, starten und abschließen.

  - id: materialfluss
    title: Materialfluss und Anlagen
    summary: Routen und Entscheidungspunkte der Fördertechnik, Geräte-Ereignisse und Fahrbefehle, Anlagensimulator.
    status: katalogisiert
    owns:
      endpoints: [/v1/flow]
      events: [flow]
      uiRoutes: [/materialfluss]
      nodeRedNodes: [wms-device-event]
    groups:
      - id: materialfluss.konfiguration
        title: Konfiguration
        summary: Routen, Schritte und Action-Matrix.
      - id: materialfluss.betrieb
        title: Betrieb
        summary: Geräte-Ereignisse, Fahrbefehle, Simulator.

  - id: auslagerung
    title: Auslagerung
    summary: Auslageraufträge zuteilen, Bestand reservieren, kommissionieren und abschließen.
    status: katalogisiert
    owns:
      endpoints: [/v1/outbound-orders, /v1/outbound-picks]
      events: [outbound-order, outbound-pick]
      uiRoutes: [/auslagerung]
    groups:
      - id: auslagerung.auftraege
        title: Aufträge
        summary: Auslageraufträge anlegen, zuteilen und beenden.
      - id: auslagerung.kommissionierung
        title: Kommissionierung
        summary: Entnahmen quittieren.

  - id: versand
    title: Versand
    summary: Gepackte TUs zu Sendungen bündeln, beim Verladen per Scan kontrollieren und mit dem Warenausgang ausbuchen.
    status: katalogisiert
    owns:
      endpoints: [/v1/shipments]
      events: [shipment]
      uiRoutes: [/versand]
    groups:
      - id: versand.sendungen
        title: Sendungen und Verladen
        summary: Versand-TUs einer Sendung zuordnen und mit Ladekontrolle verladen.
      - id: versand.warenausgang
        title: Warenausgang
        summary: Bestand ausbuchen und die Historie behalten.

  - id: dokumente
    title: Dokumente und Druck
    summary: Etiketten, Pickliste, Lieferschein und Ladeliste als PDF mit internen Barcodes.
    status: katalogisiert
    owns:
      endpoints: [/v1/documents]
    groups:
      - id: dokumente.etiketten
        title: Etiketten
        summary: Paletten- und Versandetiketten zum Aufkleben.
      - id: dokumente.belege
        title: Listen und Belege
        summary: Pickliste, Lieferschein und Ladeliste.

  - id: partner
    title: Geschäftspartner
    summary: Kunden, Lieferanten und Spediteure als Stammdaten mit Anschrift – Grundlage für Avis, Auslagerauftrag und Lieferadresse.
    status: katalogisiert
    owns:
      endpoints: [/v1/partners]
      events: [partner]
      uiRoutes: [/partner]
    groups:
      - id: partner.stammdaten
        title: Stammdaten
        summary: Partner anlegen, pflegen und deaktivieren.
      - id: partner.verwendung
        title: Verwendung an Aufträgen
        summary: Partner an Avis und Auslagerauftrag, Lieferadresse.

  - id: integration
    title: Integration und Automatisierung
    summary: Ereignisse über MQTT und Live-Stream, Node-RED-Bausteine und automatisierte Szenario-Tests.
    status: katalogisiert
    owns:
      endpoints: [/v1/events, /test]
      events: [system]
      uiRoutes: [/ereignisse]
      nodeRedNodes: [wms-config, wms-api, wms-event, wms-wait-event, wms-test-start, wms-assert, wms-test-result]
    groups:
      - id: integration.ereignisse
        title: Ereignisse
        summary: Änderungen an andere Systeme melden.
      - id: integration.schnittstellen
        title: Schnittstellen
        summary: REST-API und ihre Beschreibung.
      - id: integration.node-red
        title: Node-RED
        summary: Bausteine und Beispiele für die Anbindung ohne Programmierung.
      - id: integration.tests
        title: Testautomatisierung
        summary: Abläufe automatisch gegen die laufende Umgebung prüfen.

  - id: erp
    title: ERP-Anbindung
    summary: Artikel, Avise und Aufträge aus dem ERP übernehmen und Wareneingang, Warenausgang und Bestand zurückmelden – protokolliert und mit Wiederholung.
    status: katalogisiert
    owns:
      endpoints: [/v1/erp]
      events: [erp-message]
      uiRoutes: [/erp]
    groups:
      - id: erp.eingang
        title: Eingang (ERP → WMS)
        summary: Stammdaten und Aufträge übernehmen.
      - id: erp.ausgang
        title: Ausgang (WMS → ERP)
        summary: Rückmeldungen erzeugen und zustellen.
      - id: erp.betrieb
        title: Protokoll und Fehler
        summary: Nachrichten nachvollziehen und erneut anstoßen.

  - id: oberflaeche
    title: Bedienoberfläche
    summary: Leitstand am Desktop und Scanner-Ansicht im Handyformat als gemeinsamer Rahmen der Fachfunktionen.
    status: katalogisiert
    owns:
      uiRoutes: [/, /scanner/*]
    groups:
      - id: oberflaeche.rahmen
        title: Rahmen
        summary: Was für alle Seiten gilt.
      - id: oberflaeche.leitstand
        title: Leitstand
        summary: Seiten am Desktop.
      - id: oberflaeche.scanner
        title: Scanner
        summary: Bedienung im Lager auf mobilen Geräten.

  - id: sicherheit
    title: Sicherheit und Betrieb
    summary: Anmeldung, Rollen, Benutzerverwaltung, Service-Tokens und Betriebszustand.
    status: katalogisiert
    owns:
      endpoints: [/v1/auth, /v1/users, /health, /metrics]
      uiRoutes: [/konto, /benutzer]
    groups:
      - id: sicherheit.zugang
        title: Zugang
        summary: Anmeldung, Rollen und Tokens.
      - id: sicherheit.benutzer
        title: Benutzer
        summary: Benutzer und Passwörter verwalten.
      - id: sicherheit.infrastruktur
        title: Infrastruktur
        summary: Schutz von Node-RED und MQTT.
      - id: sicherheit.betrieb
        title: Betrieb
        summary: Betriebszustand und Datenbank.

# Vergleichssysteme. Jedes Feature trägt unter `comparisons.<id>` seine Einstufung; Fähigkeiten des
# Vergleichssystems, die bei uns fehlen, stehen in catalog/comparisons/<id>.yaml.
systems:
  - id: openwms
    title: OpenWMS.org
    description: Öffentliche Repositories von OpenWMS.org (Apache 2.0), analysiert in docs/openwms-analyse.md. Inventory, Picking, Putaway, Shipping, Printing, Partner und ERP-Adapter sind privat und nur aus der Projektbeschreibung bekannt.
    source: docs/openwms-analyse.md
    complete: true

# Technische Bestandteile, die bewusst kein eigenes Feature sind (mit Begründung).
exclusions:
  endpoints: []
