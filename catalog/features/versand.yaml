# Feature-Katalog – Bereich Versand.
area: versand

features:
  - id: versand.sendungen
    title: Sendungen bilden
    group: versand.sendungen
    summary: Fasst die gepackten Versand-TUs eines Auslagerauftrags zu einer Sendung mit Lieferadresse und Spediteur zusammen.
    description: |
      Eine Sendung (Nummer `SH00000001` …) gehört zu einem Auslagerauftrag und übernimmt dessen Kunden und Lieferadresse;
      optional wird ein Spediteur aus den Geschäftspartnern gewählt. Aufgenommen werden TUs, die am Packplatz des Auftrags
      stehen und Bestand tragen; eine TU kann nur in einer offenen Sendung sein. TUs lassen sich herausnehmen, die
      Sendung lässt sich bis zum Warenausgang stornieren – TUs und Bestand bleiben dann unverändert.
    usage:
      - channel: leitstand
        text: Seite **Versand** – Sendung mit Auftrag, Spediteur und Versand-TUs anlegen, TUs aufnehmen oder herausnehmen, stornieren.
      - channel: api
        text: "Anlegen `POST /v1/shipments` (`orderId`, `carrierCode?`, `units?`), `POST …/{number}/units`, `DELETE …/{number}/units/{barcode}`, `POST …/{number}/cancel`, Liste `GET /v1/shipments?state=…&orderId=…`."
    rules:
      - TU nicht am Packplatz → `UNIT_NOT_AT_STATION`; leer → `UNIT_EMPTY`; schon in einer offenen Sendung → `UNIT_IN_OTHER_SHIPMENT`.
      - Spediteur braucht die Rolle Spediteur (`PARTNER_ROLE_MISSING`).
      - Anlegen, Ändern und Stornieren darf der Leitstand.
    acceptance:
      - id: angelegt
        kind: effekt
        text: Eine Sendung fasst die Versand-TUs eines Auftrags mit Lieferadresse und Spediteur zusammen und wird gemeldet.
      - id: storno
        kind: effekt
        text: Ein Storno lässt TUs und Bestand stehen und gibt die TU für eine neue Sendung frei.
      - id: unit-not-at-station
        kind: regel
        text: TU nicht am Packplatz → `UNIT_NOT_AT_STATION`.
        code: UNIT_NOT_AT_STATION
      - id: unit-empty
        kind: regel
        text: Leer → `UNIT_EMPTY`.
        code: UNIT_EMPTY
      - id: unit-in-other-shipment
        kind: regel
        text: Schon in einer offenen Sendung → `UNIT_IN_OTHER_SHIPMENT`.
        code: UNIT_IN_OTHER_SHIPMENT
      - id: partner-role-missing
        kind: regel
        text: Spediteur braucht die Rolle Spediteur (`PARTNER_ROLE_MISSING`).
        code: PARTNER_ROLE_MISSING
    dependsOn: [auslagerung.packen, partner.lieferadresse]
    technical:
      components:
        - apps/api/src/modules/shipping/application/shipment.service.ts
        - apps/api/src/modules/shipping/http/shipments.controller.ts
        - apps/api/src/modules/shipping/entities/shipment.entities.ts
        - apps/web/src/pages/ShippingPage.tsx
      endpoints:
        - GET /v1/shipments
        - POST /v1/shipments
        - GET /v1/shipments/{number}
        - POST /v1/shipments/{number}/units
        - DELETE /v1/shipments/{number}/units/{barcode}
        - POST /v1/shipments/{number}/cancel
      events:
        emits: [shipment.created, shipment.changed]
      uiRoutes: [/versand]
      notes:
        - Tabellen `shipment` und `shipment_unit`, Nummernkreis `shipment_number_seq`; die Sendungszeile wird bei Änderungen gesperrt.
    evidence:
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: legt eine Sendung mit Lieferadresse und Spediteur an und prüft die TUs
        covers: [angelegt, unit-not-at-station, unit-empty, unit-in-other-shipment, partner-role-missing]
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: lässt TUs und Bestand beim Storno stehen und gibt die TU für eine neue Sendung frei
        covers: [storno]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Versand: am Packplatz packen, mit Ladekontrolle verladen, Warenausgang buchen"
        covers: [angelegt]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Versand liegt in OpenWMS im privaten Dienst Shipping.
        refs:
          - Analyse 1.1

  - id: versand.ladekontrolle
    title: Ladekontrolle beim Verladen
    group: versand.sendungen
    summary: Jede TU wird beim Verladen gescannt – eine falsche Palette wird sofort abgelehnt; sind alle gescannt, ist die Sendung verladen.
    description: |
      Beim Verladen wird der Barcode jeder TU gescannt. Gehört er nicht zur Sendung, lehnt das System ab (falsche
      Palette am Tor). Jede gescannte TU wird mit Zeit und Bediener als verladen markiert; sind alle TUs gescannt, wechselt
      die Sendung nach `LOADED` und kann ausgeliefert werden.
    usage:
      - channel: leitstand
        text: "Seite **Versand** – in der Sendung „Ladekontrolle: Barcode scannen“ und „Verladen“ (auch Rolle lager)."
      - channel: api
        text: "`POST /v1/shipments/{number}/load` mit `barcode` und optional `loadedBy`."
      - channel: scanner
        text: Ansicht **Verladen** – Sendung scannen, dann jede TU; Fortschritt „n von m“, fremde TUs werden abgelehnt.
    rules:
      - Fremde TU → 409 `WRONG_UNIT`; doppelt gescannt → 409 `UNIT_ALREADY_LOADED`; nur offene Sendungen (`SHIPMENT_STATE`).
      - Verladen darf auch die Rolle lager.
    acceptance:
      - id: verladen
        kind: effekt
        text: Jede gescannte TU wird als verladen vermerkt; sind alle gescannt, ist die Sendung `LOADED`.
      - id: wrong-unit
        kind: regel
        text: Fremde TU → 409 `WRONG_UNIT`.
        code: WRONG_UNIT
      - id: unit-already-loaded
        kind: regel
        text: Doppelt gescannt → 409 `UNIT_ALREADY_LOADED`.
        code: UNIT_ALREADY_LOADED
      - id: shipment-state
        kind: regel
        text: Nur offene Sendungen (`SHIPMENT_STATE`).
        code: SHIPMENT_STATE
    dependsOn: [versand.sendungen]
    technical:
      components:
        - apps/api/src/modules/shipping/application/shipment.service.ts
        - apps/web/src/pages/ShippingPage.tsx
        - apps/web/src/pages/ScannerPage.tsx
      endpoints:
        - POST /v1/shipments/{number}/load
      events:
        emits: [shipment.changed]
      uiRoutes: [/versand, /scanner/*]
    evidence:
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: lehnt beim Verladen eine falsche TU ab und ist verladen, wenn alle TUs gescannt sind
        covers: [verladen, wrong-unit, shipment-state]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Versand: am Packplatz packen, mit Ladekontrolle verladen, Warenausgang buchen"
        covers: [verladen]
      - kind: web-e2e
        file: apps/web/e2e/scanner.spec.ts
        test: "Scanner: am Packplatz packen und mit Ladekontrolle verladen"
        covers: [verladen]
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: meldet eine doppelt gescannte TU und bleibt offen, bis alle TUs verladen sind
        covers: [verladen, unit-already-loaded]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Verladen liegt in OpenWMS im privaten Dienst Shipping.
        refs:
          - Analyse 1.1

  - id: versand.warenausgang
    title: Warenausgang mit Historie
    group: versand.warenausgang
    summary: Bucht den Bestand aller TUs einer verladenen Sendung aus, löscht die TUs und behält ihren Inhalt in der Sendung.
    description: |
      Der Warenausgang ist nur für verladene Sendungen möglich. Der gesamte Bestand jeder TU wird mit der Buchungsart
      `SHIP` und dem Bezug `shipment:<Nummer>` ausgebucht, danach wird die TU gelöscht. Die Sendung behält Barcode und
      Inhalt (Produkt, Menge, Charge, MHD) jeder TU als Historie und meldet den Versand mit allen Inhalten.
    usage:
      - channel: leitstand
        text: Seite **Versand** – „Warenausgang buchen“, danach zeigt die Sendung den versendeten Inhalt.
      - channel: api
        text: "`POST /v1/shipments/{number}/ship` (`shippedBy?`); Inhalt in `units[].contents`."
    rules:
      - Nur `LOADED` (`SHIPMENT_STATE`); reservierter Bestand blockiert (`STOCK_RESERVED`); TUs mit laufenden Aufträgen oder gestapelten TUs blockieren (`TU_IN_USE`, `TU_HAS_CHILDREN`).
      - Alles in einer Transaktion – gelingt eine TU nicht, bleibt die ganze Sendung unverändert.
    acceptance:
      - id: ausgebucht
        kind: effekt
        text: Der Warenausgang bucht den Bestand aus, löscht die TUs, meldet die Sendung und behält den Inhalt in der Historie.
      - id: transaktion
        kind: regel
        text: Scheitert eine Prüfung, bleibt die Sendung unverändert – nichts wird gebucht.
      - id: shipment-state
        kind: regel
        text: Nur `LOADED` (`SHIPMENT_STATE`).
        code: SHIPMENT_STATE
      - id: stock-reserved
        kind: regel
        text: Reservierter Bestand blockiert (`STOCK_RESERVED`).
        code: STOCK_RESERVED
      - id: tu-in-use
        kind: regel
        text: TUs mit laufenden Aufträgen oder gestapelten TUs blockieren (`TU_IN_USE`, `TU_HAS_CHILDREN`).
        code: TU_IN_USE
      - id: tu-has-children
        kind: regel
        text: TUs mit laufenden Aufträgen oder gestapelten TUs blockieren (`TU_IN_USE`, `TU_HAS_CHILDREN`).
        code: TU_HAS_CHILDREN
    dependsOn: [versand.ladekontrolle, bestand.buchungsjournal]
    technical:
      components:
        - apps/api/src/modules/shipping/application/shipment.service.ts
        - apps/api/src/modules/inventory/application/inventory.service.ts
        - apps/api/src/modules/transport/application/transport-unit.service.ts
      endpoints:
        - POST /v1/shipments/{number}/ship
      events:
        emits: [shipment.shipped, stock.issued, transport-unit.deleted]
      uiRoutes: [/versand]
      notes:
        - Buchungsart `SHIP` im Journal; Löschprüfungen für TUs laufen in der Transaktion des Warenausgangs.
    evidence:
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: bucht den Bestand aus, löscht die TUs und behält den Inhalt in der Sendung
        covers: [ausgebucht, shipment-state]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Versand: am Packplatz packen, mit Ladekontrolle verladen, Warenausgang buchen"
        covers: [ausgebucht]
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: bucht nicht aus, solange Bestand reserviert ist, TUs daraufstehen oder eine Bewegung offen ist
        covers: [transaktion, stock-reserved, tu-in-use, tu-has-children]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Warenausgang liegt in OpenWMS im privaten Dienst Shipping.
        refs:
          - Analyse 1.1
