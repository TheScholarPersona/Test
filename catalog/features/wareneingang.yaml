# Feature-Katalog – Bereich Wareneingang.
area: wareneingang

features:
  - id: wareneingang.avis
    title: Wareneingang avisieren
    group: wareneingang.avis
    summary: Kündigt erwartete Lieferungen als Auftrag an – mit Mengen je Produkt oder ganzen, vorab bekannten Paletten.
    description: |
      Ein Wareneingangsauftrag (Avis) hat eine Auftragsnummer, einen Lieferanten und Positionen. Mengenpositionen
      erwarten eine Menge eines Produkts, TU-Positionen eine ganze TU eines Typs, optional mit erwartetem Barcode
      (z. B. SSCC). Positionsnummern werden vergeben, wenn sie fehlen. Auftrag und Positionen lassen sich lesen.
    usage:
      - channel: api
        text: '`POST /v1/receiving-orders` mit `orderId`, `supplier`, `positions`; lesen `GET /v1/receiving-orders/{orderId}`.'
      - channel: leitstand
        text: Seite **Wareneingang** – Avis anlegen (Rolle leitstand), Auftragsliste neueste zuerst.
    rules:
      - Auftragsnummer eindeutig; Produkte und Einheiten müssen existieren und passen.
    acceptance:
      - id: angelegt
        kind: effekt
        text: Ein Avis steht mit Mengen- und TU-Positionen bereit und ist nach Lieferant und Zustand auffindbar.
      - id: gueltig
        kind: regel
        text: Doppelte Auftragsnummern, unbekannte Produkte und unpassende Einheiten werden abgelehnt.
    dependsOn: [bestand.produktstamm]
    technical:
      components:
        - apps/api/src/modules/receiving/application/receiving.service.ts
        - apps/api/src/modules/receiving/http/receiving.controller.ts
        - apps/web/src/pages/ReceivingPage.tsx
      endpoints:
        - POST /v1/receiving-orders
        - GET /v1/receiving-orders/{orderId}
        - GET /v1/receiving-orders
      events:
        emits: [receiving-order.created]
      notes:
        - Tabellen `receiving_order` und `receiving_position`.
      uiRoutes:
        - /wareneingang
    evidence:
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: legt einen Auftrag mit Mengen- und TU-Positionen an
        covers: [angelegt]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: prüft Auftragsnummer, Produkte und Einheiten
        covers: [gueltig]
      - kind: scenario
        id: receiving-flow
        covers: [angelegt]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Wareneingang: Avis anlegen, Ware erfassen, Auftrag abschließen"
        covers: [angelegt]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: listet Aufträge, gefiltert nach Lieferant und Zustand
        covers: [angelegt]
    comparisons:
      openwms:
        status: eingeschraenkt
        note: Avis mit Mengen- und TU-Positionen wie in OpenWMS (R-01); Priorität, Detailattribute und Sperrkennzeichen des Auftrags fehlen.
        refs:
          - Analyse 2.1 ReceivingOrder
          - Analyse 3.5 R-01

  - id: wareneingang.erfassung
    title: Ware gegen ein Avis erfassen
    group: wareneingang.erfassung
    summary: Bucht angelieferte Ware als Bestand auf eine Palette und ordnet sie automatisch der passenden Position zu.
    description: |
      Eine Mengenerfassung bucht ein Produkt auf eine vorhandene oder neue TU (Barcode wird vergeben) mit Charge und
      MHD; das WMS wählt die erste offene Position mit ausreichender Restmenge. Eine TU-Erfassung bucht eine
      avisierte TU per Barcode auf den Platz. Auf Wunsch entsteht gleich die Einlagerbewegung. Erfassungen lassen sich
      je Auftrag abrufen; parallele Erfassungen verlieren keine Menge.
    usage:
      - channel: api
        text: "`POST /v1/receiving-orders/{orderId}/captures` (`kind: quantity` oder `unit`), Liste `GET …/captures`."
      - channel: node-red
        text: Node `wms-receive` erfasst gegen einen Auftrag oder ohne Avis; Beispiel-Flow ERP-CSV → Wareneingang.
      - channel: leitstand
        text: Seite **Wareneingang** – Auftrag wählen, Ware erfassen (neue oder vorhandene TU, Platz, Charge).
    rules:
      - Überlieferung nur, wenn das Produkt sie erlaubt (`OVERDELIVERY_NOT_ALLOWED` mit Restmengen).
      - Keine Erfassung auf abgeschlossene Aufträge (`ORDER_CLOSED`).
      - Bestand erhält den Bezug `receiving:<orderId>/<posNo>`.
    acceptance:
      - id: erfasst
        kind: effekt
        text: Die Erfassung bucht Bestand auf eine TU und ordnet ihn der passenden Position zu; Bestand gleicher Art wird zusammengeführt.
      - id: ueberlieferung
        kind: effekt
        text: Erlaubte Überlieferung wird gebucht und schließt die Position.
      - id: einlagerung
        kind: effekt
        text: Auf Wunsch entsteht direkt die Einlagerbewegung.
      - id: erfassungen
        kind: effekt
        text: Die Erfassungen eines Auftrags sind abrufbar.
      - id: parallel
        kind: regel
        text: Gleichzeitige Erfassungen auf einen Auftrag verlieren keine Menge.
      - id: overdelivery-not-allowed
        kind: regel
        text: Überlieferung nur, wenn das Produkt sie erlaubt (`OVERDELIVERY_NOT_ALLOWED` mit Restmengen).
        code: OVERDELIVERY_NOT_ALLOWED
      - id: order-closed
        kind: regel
        text: Keine Erfassung auf abgeschlossene Aufträge (`ORDER_CLOSED`).
        code: ORDER_CLOSED
    settings:
      - name: Überlieferung je Produkt
        description: "`overdeliveryAllowed` am Produkt."
        where: "PATCH /v1/products/{sku}"
      - name: Direkte Einlagerung
        description: "`putawayGroup` legt gleich eine Einlagerbewegung in diese Gruppe an."
        where: Erfassung
    dependsOn: [wareneingang.avis, bestand.bestand-je-tu]
    technical:
      components:
        - apps/api/src/modules/receiving/application/receiving.service.ts
        - apps/api/src/modules/receiving/domain/receiving-rules.ts
        - packages/node-red-nodes/nodes/wms-receive.js
      endpoints:
        - POST /v1/receiving-orders/{orderId}/captures
        - GET /v1/receiving-orders/{orderId}/captures
      events:
        emits: [receiving.captured, receiving-position.state-changed, receiving-order.state-changed, stock.received]
      nodeRedNodes: [wms-receive]
      notes:
        - Zeilensperre des Auftrags serialisiert parallele Erfassungen.
      uiRoutes:
        - /wareneingang
    evidence:
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: erfasst eine Teilmenge auf eine neue TU und bucht Bestand
        covers: [erfasst]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: nimmt die Position, deren Restmenge reicht, und führt Bestand zusammen
        covers: [erfasst]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: lehnt Überlieferung ab, wenn das Produkt sie nicht erlaubt, und ändert nichts
        covers: [overdelivery-not-allowed]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: bucht erlaubte Überlieferung und schließt die Position
        covers: [ueberlieferung]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: erfasst eine avisierte TU per Barcode
        covers: [erfasst]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: legt auf Wunsch direkt die Einlagerbewegung an
        covers: [einlagerung]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: listet die Erfassungen eines Auftrags
        covers: [erfassungen]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: verliert bei gleichzeitigen Erfassungen auf einen Auftrag keine Menge
        covers: [parallel]
      - kind: unit
        file: packages/node-red-nodes/test/nodes.test.mjs
        test: wms-receive erfasst blind oder gegen einen Auftrag
        covers: [erfasst]
      - kind: scenario
        id: receiving-flow
        covers: [erfasst, overdelivery-not-allowed, order-closed]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Wareneingang: Avis anlegen, Ware erfassen, Auftrag abschließen"
        covers: [erfasst]
    comparisons:
      openwms:
        status: erweitert
        note: Zuordnung zur Position wie in OpenWMS (R-02 bis R-04, hier in der Basiseinheit); zusätzlich direkte Einlagerbewegung und serialisierte parallele Erfassung.
        refs:
          - Analyse 3.5 R-02, R-03, R-04

  - id: wareneingang.abschluss
    title: Positionen und Aufträge abschließen oder stornieren
    group: wareneingang.avis
    summary: Schließt Lieferungen mit Fehlmenge ab oder storniert, was nicht kommt – der Auftragszustand folgt automatisch.
    description: |
      Unberührte Positionen lassen sich stornieren, teilweise erfasste mit Fehlmenge schließen (`SHORT`). Der
      Auftrag folgt aus seinen Positionen (`OPEN`, `IN_PROGRESS`, `COMPLETED`, `PARTIALLY_COMPLETED`,
      `CANCELLED`). Ein Auftrag ohne Erfassungen kann storniert werden; der Abschluss schließt teilweise erfasste und
      storniert unberührte Positionen.
    usage:
      - channel: api
        text: "`POST …/positions/{posNo}/cancel`, `…/positions/{posNo}/close`, `POST …/{orderId}/cancel`, `…/complete`."
      - channel: leitstand
        text: Seite **Wareneingang** – Auftrag abschließen oder stornieren.
    rules:
      - Position stornieren nur unberührt (`POSITION_NOT_OPEN`), schließen nur teilweise erfasst (`POSITION_NOT_IN_PROGRESS`).
      - Auftrag stornieren nur ohne Erfassungen (`CANCELLATION_DENIED`).
    acceptance:
      - id: abgeschlossen
        kind: effekt
        text: Teilweise erfasste Positionen schließen mit Fehlmenge; der Auftragsabschluss schließt die restlichen Positionen.
      - id: storniert
        kind: effekt
        text: Ein Auftrag ohne Erfassungen wird vollständig storniert.
      - id: erledigt
        kind: regel
        text: Eine Position ist erst bei voller Menge erledigt.
      - id: position-not-open
        kind: regel
        text: Position stornieren nur unberührt (`POSITION_NOT_OPEN`), schließen nur teilweise erfasst (`POSITION_NOT_IN_PROGRESS`).
        code: POSITION_NOT_OPEN
      - id: position-not-in-progress
        kind: regel
        text: Position stornieren nur unberührt (`POSITION_NOT_OPEN`), schließen nur teilweise erfasst (`POSITION_NOT_IN_PROGRESS`).
        code: POSITION_NOT_IN_PROGRESS
      - id: cancellation-denied
        kind: regel
        text: Auftrag stornieren nur ohne Erfassungen (`CANCELLATION_DENIED`).
        code: CANCELLATION_DENIED
    dependsOn: [wareneingang.avis]
    technical:
      components:
        - apps/api/src/modules/receiving/application/receiving.service.ts
        - apps/api/src/modules/receiving/domain/receiving-rules.ts
      endpoints:
        - POST /v1/receiving-orders/{orderId}/positions/{posNo}/cancel
        - POST /v1/receiving-orders/{orderId}/positions/{posNo}/close
        - POST /v1/receiving-orders/{orderId}/cancel
        - POST /v1/receiving-orders/{orderId}/complete
      events:
        emits: [receiving-position.state-changed, receiving-order.state-changed]
      uiRoutes:
        - /wareneingang
    evidence:
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: storniert nur unberührte Positionen und schließt teilweise erfasste mit Fehlmenge
        covers: [abgeschlossen, position-not-open, position-not-in-progress]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: storniert keinen Auftrag mit Erfassungen; Abschluss schließt die restlichen Positionen
        covers: [abgeschlossen, cancellation-denied]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: storniert einen Auftrag ohne Erfassungen vollständig
        covers: [storniert]
      - kind: unit
        file: apps/api/test/unit/receiving/receiving-rules.test.ts
        test: setzt Positionen erst bei voller Menge auf erledigt
        covers: [erledigt]
      - kind: scenario
        id: receiving-flow
        covers: [abgeschlossen]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Wareneingang: Avis anlegen, Ware erfassen, Auftrag abschließen"
        covers: [abgeschlossen]
    comparisons:
      openwms:
        status: erweitert
        note: Auftragszustand aus Positionen wie in OpenWMS (R-05, R-06); zusätzlich Position stornieren oder mit Fehlmenge schließen.
        refs:
          - Analyse 3.5 R-05, R-06, R-07

  - id: wareneingang.ohne-avis
    title: Wareneingang ohne Avis
    group: wareneingang.erfassung
    summary: Bucht Ware, die ohne Ankündigung kommt, direkt als Bestand – am Scanner oder per Schnittstelle.
    description: |
      Die Blind-Erfassung bucht ein Produkt mit Menge, Charge und MHD auf eine vorhandene oder neue TU auf einem Platz,
      ohne Bezug zu einem Auftrag. Der Bestand erhält den Bezug `receiving:blind`.
    usage:
      - channel: scanner
        text: Ansicht **Wareneingang** – Produkt, Menge, TU und Platz scannen.
      - channel: api
        text: "`POST /v1/receiving-blind-captures` mit `sku`, `quantity`, `unit`, `location`, `lot?`, `bestBefore?`."
      - channel: node-red
        text: Node `wms-receive` ohne Auftragsnummer.
    acceptance:
      - id: gebucht
        kind: effekt
        text: Ware ohne Avis wird direkt als Bestand auf eine TU gebucht, auch am Scanner.
    dependsOn: [bestand.bestand-je-tu]
    technical:
      components:
        - apps/api/src/modules/receiving/application/receiving.service.ts
        - apps/web/src/pages/ScannerPage.tsx
      endpoints:
        - POST /v1/receiving-blind-captures
      events:
        emits: [receiving.captured, stock.received]
      uiRoutes: [/scanner/*]
      nodeRedNodes: [wms-receive]
    evidence:
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: bucht Ware ohne Avis
        covers: [gebucht]
      - kind: web-e2e
        file: apps/web/e2e/scanner.spec.ts
        test: "Scanner: Wareneingang ohne Avis"
        covers: [gebucht]
      - kind: scenario
        id: stock-flow
        covers: [gebucht]
    comparisons:
      openwms:
        status: gleichwertig
        note: Blind-Erfassung wie in OpenWMS (POST /v1/capture).
        refs:
          - Analyse 3.3 wms-receiving

  - id: wareneingang.avis-steuerung
    title: Avis priorisieren, beschreiben und sperren
    group: wareneingang.avis
    summary: Gibt Avisen eine Priorität, frei definierbare Detailattribute und eine Sperre, die die Erfassung bis zur Freigabe verhindert.
    description: |
      Ein Avis hat eine Priorität (höchste bis niedrigste, Standard normal) und bis zu 30 frei definierbare
      Detailattribute (Schlüssel → Text, z. B. Rampe, Frachtbrief, Temperaturzone). Priorität, Termin und Attribute
      lassen sich ändern; Attribute werden zusammengeführt, `null` löscht eines. Ein gesperrtes Avis (optional mit
      Grund) nimmt keine Erfassung an, bis es entsperrt wird. Die Liste filtert nach Priorität und Sperre und sortiert
      auf Wunsch nach Priorität und Termin.
    usage:
      - channel: leitstand
        text: Seite **Wareneingang** – Priorität beim Anlegen und im Auftrag, „Attribut setzen“, „Sperren“/„Entsperren“, Sortierung nach Priorität.
      - channel: api
        text: "`POST /v1/receiving-orders` mit `priority`, `details`; `PATCH /v1/receiving-orders/{orderId}`; `POST …/{orderId}/lock` (`reason?`), `POST …/{orderId}/unlock`; Liste `?priority=…&locked=…&sort=priority`."
    rules:
      - Erfassung gegen ein gesperrtes Avis → 409 `ORDER_LOCKED`.
      - Abgeschlossene oder stornierte Avise lassen sich weder ändern noch sperren (`ORDER_CLOSED`).
      - Ändern und Sperren darf der Leitstand.
    acceptance:
      - id: sortiert
        kind: effekt
        text: Avise tragen Priorität und Attribute und sind nach Priorität und Termin sortiert.
      - id: geaendert
        kind: effekt
        text: Änderungen an Priorität, Termin und Attributen melden die geänderten Felder.
      - id: order-locked
        kind: regel
        text: Erfassung gegen ein gesperrtes Avis → 409 `ORDER_LOCKED`.
        code: ORDER_LOCKED
      - id: order-closed
        kind: regel
        text: Abgeschlossene oder stornierte Avise lassen sich weder ändern noch sperren (`ORDER_CLOSED`).
        code: ORDER_CLOSED
    dependsOn: [wareneingang.avis]
    technical:
      components:
        - apps/api/src/modules/receiving/application/receiving.service.ts
        - apps/api/src/modules/receiving/http/receiving.controller.ts
        - apps/web/src/pages/ReceivingPage.tsx
      endpoints:
        - PATCH /v1/receiving-orders/{orderId}
        - POST /v1/receiving-orders/{orderId}/lock
        - POST /v1/receiving-orders/{orderId}/unlock
      events:
        emits: [receiving-order.changed]
      uiRoutes: [/wareneingang]
      notes:
        - Spalten `priority`, `priority_rank`, `details` (jsonb), `locked`, `lock_reason` an `receiving_order`.
    evidence:
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: legt Avise mit Priorität und Attributen an und sortiert nach Priorität und Termin
        covers: [sortiert]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: ändert Priorität, Termin und Attribute und meldet die geänderten Felder
        covers: [geaendert]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: lehnt die Erfassung gegen ein gesperrtes Avis ab, bis es entsperrt wird
        covers: [order-locked]
      - kind: integration
        file: apps/api/test/integration/receiving.integration.test.ts
        test: ändert und sperrt abgeschlossene Avise nicht mehr
        covers: [order-closed]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Wareneingang: Avis mit Priorität und Attribut, Sperre verhindert die Erfassung"
        covers: [sortiert, order-locked]
    comparisons:
      openwms:
        status: erweitert
        note: Entspricht `priority`, `details` und `locked` an ReceivingOrder; zusätzlich Sperrgrund, Sortierung nach Priorität und Bedienung im Leitstand.
        refs:
          - Analyse 2.1 ReceivingOrder
