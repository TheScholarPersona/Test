# Feature-Katalog – Bereich Lagerbewegungen.
area: lagerbewegungen

features:
  - id: lagerbewegungen.anlegen
    title: Lagerbewegung mit festem Ziel oder Zielbereich anlegen
    group: lagerbewegungen.planung
    summary: Beauftragt, eine Palette an einen Platz oder in einen Bereich zu bringen – im Bereich wählt die Einlagerstrategie den Platz.
    description: |
      Eine Lagerbewegung (Nummer `MV00000001` …) bringt eine TU samt Stapel zu einem Ziel. Ein fester Zielplatz wird
      gegen die Platzregeln geprüft; bei einer Zielgruppe wählt der aktive Einlager-Regelsatz den Platz, der
      Bewegungstyp steht dort als Fakt zur Verfügung (z. B. Leergut in die Leergutzone). Das Ziel wird reserviert.
    usage:
      - channel: api
        text: '`POST /v1/movements` mit `barcode`, `type`, `target` (`{ "location": … }` oder `{ "group": … }`), `priority`.'
    rules:
      - Je TU höchstens eine offene Bewegung (`MOVEMENT_EXISTS`, per Datenbank abgesichert).
      - Bereits reservierte Ziele werden abgelehnt; findet die Strategie keinen Platz, wird nichts angelegt (`NO_TARGET_LOCATION`).
      - Typen `INBOUND`, `RELOCATION`, `REPLENISHMENT`, `OUTBOUND`, `EMPTIES`, `CLEARING`, `MANUAL`.
    acceptance:
      - id: festes-ziel
        kind: effekt
        text: Eine Bewegung mit festem Ziel entsteht im Zustand `OPEN` und reserviert den Zielplatz.
      - id: zielbereich
        kind: effekt
        text: Bei einem Zielbereich wählt die Einlagerstrategie den Platz, auch abhängig vom Bewegungstyp.
      - id: ziel-reserviert
        kind: regel
        text: Ein bereits reserviertes Ziel wird abgelehnt.
        code: PLACEMENT_REJECTED
      - id: movement-exists
        kind: regel
        text: Je TU höchstens eine offene Bewegung (`MOVEMENT_EXISTS`, per Datenbank abgesichert).
        code: MOVEMENT_EXISTS
      - id: no-target-location
        kind: regel
        text: Findet die Strategie keinen Platz, wird nichts angelegt (`NO_TARGET_LOCATION`).
        code: NO_TARGET_LOCATION
    dependsOn: [transporteinheiten.anlegen, strategien.einlagerplatz]
    technical:
      components:
        - apps/api/src/modules/movement/application/movement.service.ts
        - apps/api/src/modules/movement/http/movements.controller.ts
      endpoints:
        - POST /v1/movements
        - GET /v1/movements/{number}
      events:
        emits: [movement.created]
      notes:
        - Tabelle `movement`; Bewegungen werden nie gelöscht, Barcode und Koordinaten bleiben als Historie erhalten.
    evidence:
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: legt eine Bewegung mit festem Ziel an und reserviert es
        covers: [festes-ziel]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: erlaubt je TU nur eine offene Bewegung
        covers: [movement-exists]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: lehnt ein bereits reserviertes Ziel ab
        covers: [ziel-reserviert]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: bestimmt das Ziel aus einer Gruppe über die Einlagerstrategie
        covers: [zielbereich]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: nutzt den Bewegungstyp in Regelsätzen (Leergut in die Leergutzone)
        covers: [zielbereich]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: legt nichts an, wenn kein Zielplatz frei ist
        covers: [no-target-location]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: legt für eine TU auch bei gleichzeitigen Anfragen nur eine offene Bewegung an
        covers: [movement-exists]
      - kind: scenario
        id: movement-flow
        covers: [festes-ziel, zielbereich]
    comparisons:
      openwms:
        status: gleichwertig
        note: Bewegung mit Ziel, Typ und Priorität wie in OpenWMS (M-01); Zielwahl über eigene Einlagerstrategie statt privatem Putaway-Dienst.
        refs:
          - Analyse 3.5 M-01, M-04

  - id: lagerbewegungen.arbeitsliste
    title: Arbeitsliste der Lagerbewegungen
    group: lagerbewegungen.planung
    summary: Zeigt Bedienern die dringendsten Bewegungen zuerst, filterbar nach Zustand, Typ, TU und Bearbeiter.
    description: Die Arbeitsliste sortiert nach Priorität, dann nach Alter und filtert nach Zustand, Bewegungstyp, Barcode und Bearbeiter.
    usage:
      - channel: api
        text: "`GET /v1/movements?state=OPEN,IN_PROGRESS&type=INBOUND&assignedTo=…&group=…`"
      - channel: leitstand
        text: Seite **Transport** – offene Bewegungen, dringendste zuerst.
    acceptance:
      - id: sortiert
        kind: effekt
        text: Die Liste zeigt die Bewegungen nach Priorität, dann nach Alter, filterbar nach Zustand und Typ.
    technical:
      components:
        - apps/api/src/modules/movement/application/movement.service.ts
      endpoints:
        - GET /v1/movements
      uiRoutes:
        - /transport
    evidence:
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: sortiert nach Priorität, dann nach Alter, und filtert nach Zustand und Typ
        covers: [sortiert]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Transport: Lagerbewegung und Transportauftrag bedienen"
        covers: [sortiert]
    comparisons:
      openwms:
        status: gleichwertig
        note: Abfrage nach Barcode, Typen und Zuständen wie in OpenWMS.
        refs:
          - Analyse 3.3 movement-service

  - id: lagerbewegungen.ausfuehren
    title: Lagerbewegung ausführen, abschließen oder stornieren
    group: lagerbewegungen.ausfuehrung
    summary: Führt eine Bewegung vom Beginn bis zur Buchung am Ziel – Abweichungen vom geplanten Ziel werden vermerkt.
    description: |
      Ein Bediener beginnt eine Bewegung, kann sie zurückgeben und schließt sie ab. Der Abschluss bucht die TU mit allen
      Platzregeln (`checked` oder `physical`); ohne Platzangabe gilt das Ziel, ein anderer Platz ist eine
      Abweichung und gibt das ursprüngliche Ziel frei. Ein Storno hebt die Zielreservierung auf. Andere Übergänge
      werden abgelehnt; jede Antwort nennt die erlaubten Aktionen.
    usage:
      - channel: api
        text: "`POST /v1/movements/{number}/start`, `…/release`, `…/complete` (`location?`, `mode?`), `…/cancel`."
      - channel: leitstand
        text: Seite **Transport** – Beginnen, Abschließen, Stornieren je Bewegung.
    rules:
      - Zustände `OPEN` → `IN_PROGRESS` → `DONE`, Storno nach `CANCELLED`; sonst `INVALID_STATE_TRANSITION`.
      - TUs mit offener Bewegung und Plätze, die Ziel einer offenen Bewegung sind, können nicht gelöscht werden.
    acceptance:
      - id: abgeschlossen
        kind: effekt
        text: Beginnen, Zurückgeben und Abschließen führen die Bewegung; der Abschluss bucht die TU am Ziel und meldet Quelle und Ziel.
      - id: abweichung
        kind: effekt
        text: Beim Abschluss gelten die Platzregeln; ein abweichendes Ziel wird vermerkt.
      - id: storno
        kind: effekt
        text: Ein Storno gibt die Reservierung des Ziels frei.
      - id: geschuetzt
        kind: regel
        text: TUs mit offener Bewegung und Plätze, die Ziel einer offenen Bewegung sind, lassen sich nicht löschen.
        code: TU_IN_USE
      - id: invalid-state-transition
        kind: regel
        text: Sonst `INVALID_STATE_TRANSITION`.
        code: INVALID_STATE_TRANSITION
    dependsOn: [lagerbewegungen.anlegen, transporteinheiten.platzierungspruefung]
    technical:
      components:
        - apps/api/src/modules/movement/application/movement.service.ts
        - apps/api/src/modules/movement/domain/movement-state.ts
        - apps/web/src/pages/TransportPage.tsx
      endpoints:
        - POST /v1/movements/{number}/start
        - POST /v1/movements/{number}/release
        - POST /v1/movements/{number}/complete
        - POST /v1/movements/{number}/cancel
      events:
        emits: [movement.started, movement.released, movement.completed, movement.cancelled]
      uiRoutes:
        - /transport
    evidence:
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: beginnt, gibt zurück und beginnt erneut
        covers: [abgeschlossen, invalid-state-transition]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: schließt ab, bucht die TU und meldet Quelle und Ziel
        covers: [abgeschlossen, invalid-state-transition]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: prüft beim Abschluss die Platzregeln und vermerkt Abweichungen vom Ziel
        covers: [abweichung]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: storniert und gibt die Reservierung frei
        covers: [storno]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: schützt TUs mit offener Bewegung und Plätze, die Ziel einer offenen Bewegung sind
        rationale: Prüft den Löschschutz über `DELETE` auf TU und Platz – die Regel gehört zur Bewegung, die Endpunkte zu TUs und Plätzen.
        covers: [geschuetzt]
      - kind: unit
        file: apps/api/test/unit/movement/movement-state.test.ts
        test: kennt Endzustände und erlaubte Aktionen
        covers: [abgeschlossen]
      - kind: scenario
        id: movement-flow
        covers: [abgeschlossen, invalid-state-transition]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Transport: Lagerbewegung und Transportauftrag bedienen"
        covers: [abgeschlossen]
    comparisons:
      openwms:
        status: erweitert
        note: Expliziter Zustandsautomat statt Ordinal-Vergleich und übernommenem Zustand (OpenWMS-Fehler 5.4 Nr. 2–5); Abweichungen vom Ziel werden vermerkt.
        refs:
          - Analyse 3.5 M-02, M-03
          - Analyse 5.4 Nr. 2–5

  - id: lagerbewegungen.bewegungsgruppen
    title: Bewegungsgruppen mit Zuteilung an Bediener
    group: lagerbewegungen.planung
    summary: Bündelt mehrere Lagerbewegungen zu einer Tour und teilt sie einem Bediener zu – er beginnt sie mit einem Klick und kann sie zurückgeben.
    description: |
      Eine Bewegungsgruppe (Nummer `MG00000001` …) fasst offene oder laufende Lagerbewegungen zusammen, optional mit
      Beschreibung und zugeteiltem Bediener. Beginnen startet alle offenen Bewegungen der Gruppe für den zugeteilten
      Bediener (oder den Angemeldeten), Zurückgeben öffnet alle laufenden wieder und hebt die Zuteilung auf. Bewegungen
      lassen sich aufnehmen und entfernen; abgeschlossen und storniert wird weiter je Bewegung, weil jede TU einzeln am
      Ziel ankommt. Der Zustand der Gruppe folgt aus ihren Bewegungen.
    usage:
      - channel: leitstand
        text: Seite **Transport** – Bewegungen auswählen, Bediener eintragen, „Gruppe bilden“; je Gruppe „Zuteilen“, „Beginnen“, „Zurückgeben“.
      - channel: api
        text: "Bilden `POST /v1/movement-groups` (`movements`, `assignedTo?`, `description?`), ändern `PATCH …/{number}` (`add`, `remove`), `POST …/{number}/assign`, `…/start`, `…/release`, Liste `GET /v1/movement-groups?state=…&assignedTo=…`."
    rules:
      - Eine Bewegung gehört höchstens zu einer Gruppe (`MOVEMENT_GROUPED`); nur offene oder laufende Bewegungen (`MOVEMENT_CLOSED`).
      - Sind alle Bewegungen beendet, ist die Gruppe erledigt und nimmt nichts mehr auf (`GROUP_CLOSED`).
      - Zustand abgeleitet – `IN_PROGRESS`, sobald eine Bewegung läuft; `DONE`/`CANCELLED`, wenn alle beendet sind.
      - Bilden, Ändern und Zuteilen darf der Leitstand; Beginnen und Zurückgeben auch die Rolle lager.
    acceptance:
      - id: gebildet
        kind: effekt
        text: Offene Bewegungen werden zu einer Gruppe mit Bediener gebündelt; Bewegungen lassen sich aufnehmen und entfernen.
      - id: begonnen
        kind: effekt
        text: Der zugeteilte Bediener beginnt alle Bewegungen der Gruppe mit einem Aufruf und kann sie zurückgeben.
      - id: abgeleitet
        kind: regel
        text: "Der Gruppenzustand folgt den Bewegungen: `IN_PROGRESS`, sobald eine läuft; erledigt, wenn alle beendet sind."
        code: IN_PROGRESS
      - id: movement-grouped
        kind: regel
        text: Eine Bewegung gehört höchstens zu einer Gruppe (`MOVEMENT_GROUPED`).
        code: MOVEMENT_GROUPED
      - id: movement-closed
        kind: regel
        text: Nur offene oder laufende Bewegungen (`MOVEMENT_CLOSED`).
        code: MOVEMENT_CLOSED
      - id: group-closed
        kind: regel
        text: Sind alle Bewegungen beendet, ist die Gruppe erledigt und nimmt nichts mehr auf (`GROUP_CLOSED`).
        code: GROUP_CLOSED
    dependsOn: [lagerbewegungen.anlegen, lagerbewegungen.ausfuehren]
    technical:
      components:
        - apps/api/src/modules/movement/application/movement-group.service.ts
        - apps/api/src/modules/movement/http/movement-groups.controller.ts
        - apps/api/src/modules/movement/entities/movement-group.entity.ts
        - apps/web/src/pages/TransportPage.tsx
      endpoints:
        - GET /v1/movement-groups
        - POST /v1/movement-groups
        - GET /v1/movement-groups/{number}
        - PATCH /v1/movement-groups/{number}
        - POST /v1/movement-groups/{number}/assign
        - POST /v1/movement-groups/{number}/start
        - POST /v1/movement-groups/{number}/release
      events:
        emits: [movement-group.created, movement-group.changed, movement.started, movement.released]
      uiRoutes: [/transport]
      notes:
        - Tabelle `movement_group`, Nummernkreis `movement_group_number_seq`, Spalte `group_id` an `movement`; Gruppenzeile wird bei Änderungen gesperrt.
    evidence:
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: bündelt offene Bewegungen zu einer Gruppe und lehnt Doppelzuordnung ab
        covers: [gebildet, movement-grouped, movement-closed]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: nimmt Bewegungen auf und entfernt sie wieder
        covers: [gebildet]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: beginnt alle Bewegungen für den zugeteilten Bediener und gibt sie zurück
        covers: [begonnen, abgeleitet]
      - kind: integration
        file: apps/api/test/integration/movement.integration.test.ts
        test: wird erledigt, wenn alle Bewegungen abgeschlossen sind, und nimmt dann nichts mehr auf
        covers: [abgeleitet, group-closed]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Bewegungsgruppen: bilden, zuteilen, beginnen und zurückgeben"
        covers: [gebildet, begonnen]
    comparisons:
      openwms:
        status: erweitert
        note: Entspricht MovementGroup (Name, Zustand, zugeteilter Bediener, Bewegungen); zusätzlich gemeinsames Beginnen und Zurückgeben, Umzuteilung laufender Bewegungen, abgeleiteter Zustand und Bedienung im Leitstand.
        refs:
          - Analyse 2.1 MovementGroup
