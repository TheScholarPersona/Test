# Feature-Katalog – Bereich Strategien und Regeln.
area: strategien

features:
  - id: strategien.katalog
    title: Entscheidungspunkte und Strategien abfragen
    group: strategien.regelsaetze
    summary: Zeigt, welche Entscheidungen konfigurierbar sind, welche Felder Bedingungen nutzen können und welche Strategien mit welchen Parametern es gibt.
    description: |
      Für jeden Entscheidungspunkt (`putaway` – Einlagerung, `allocation` – Auslagerung) liefert das WMS den
      Feldkatalog für Bedingungen (mit Typ) und die Strategien mit dem JSON-Schema ihrer Parameter. Damit lassen sich
      Regelsätze ohne Blick in den Code schreiben und Eingabemasken erzeugen.
    usage:
      - channel: api
        text: "`GET /v1/strategies`"
    acceptance:
      - id: beschrieben
        kind: effekt
        text: Die API beschreibt die Entscheidungspunkte mit ihren Feldern und Strategien samt Parametern, auch alle Auslagerstrategien.
    technical:
      components:
        - apps/api/src/modules/strategy/application/strategy-registry.ts
        - apps/api/src/modules/strategy/http/strategies.controller.ts
      endpoints:
        - GET /v1/strategies
    evidence:
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: beschreibt Entscheidungspunkte, Felder und Strategien
        covers: [beschrieben]
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: listet den Entscheidungspunkt mit allen Auslagerstrategien
        covers: [beschrieben]
    comparisons:
      openwms:
        status: neu
        note: Das öffentliche OpenWMS hat kein konfigurierbares Regelwerk.
        refs:
          - Analyse 5.1b

  - id: strategien.regelsaetze
    title: Versionierte Regelsätze mit Entwurf und Aktivierung
    group: strategien.regelsaetze
    summary: Konfiguriert Lagerentscheidungen als Regeln statt im Code – mit Entwürfen, Prüfung beim Speichern und kontrolliertem Umschalten.
    description: |
      Ein Regelsatz ist eine geordnete Liste von Regeln für einen Entscheidungspunkt; die erste zutreffende Regel
      bestimmt Strategie und Parameter, die letzte muss immer zutreffen (Rückfall). Neue Regelsätze entstehen als
      Entwurf mit der nächsten Version, sind änderbar und löschbar. Die Aktivierung archiviert den bisher aktiven
      Regelsatz; aktive und archivierte Regelsätze sind unveränderlich.
    usage:
      - channel: api
        text: "Entwurf `POST /v1/strategy-rule-sets`, ändern `PUT …/{id}`, löschen `DELETE …/{id}`, aktivieren `POST …/{id}/activate`, Liste `GET /v1/strategy-rule-sets`, einzeln `GET …/{id}`."
    rules:
      - Beim Speichern werden Felder, Operatoren, Werttypen, Strategien und Parameter vollständig geprüft (`RULE_SET_INVALID` mit Pfad).
      - Höchstens ein aktiver Regelsatz je Entscheidungspunkt, auch per Datenbank abgesichert.
      - Nur Entwürfe sind änderbar (`RULE_SET_NOT_DRAFT`).
    acceptance:
      - id: aktiviert
        kind: effekt
        text: Ein Entwurf wird gespeichert, einzeln mit allen Regeln gelesen und aktiviert; aktiv ist danach genau er.
      - id: rule-set-invalid
        kind: regel
        text: Beim Speichern werden Felder, Operatoren, Werttypen, Strategien und Parameter vollständig geprüft (`RULE_SET_INVALID` mit Pfad).
        code: RULE_SET_INVALID
      - id: rule-set-not-draft
        kind: regel
        text: Nur Entwürfe sind änderbar (`RULE_SET_NOT_DRAFT`).
        code: RULE_SET_NOT_DRAFT
    settings:
      - name: Regeln je Entscheidungspunkt
        description: Bedingung (`when`), Strategie und Parameter je Regel; Reihenfolge entscheidet.
        where: "PUT /v1/strategy-rule-sets/{id}"
    technical:
      components:
        - apps/api/src/modules/strategy/application/rule-set.service.ts
        - apps/api/src/modules/strategy/domain/rule-set.ts
      endpoints:
        - GET /v1/strategy-rule-sets
        - POST /v1/strategy-rule-sets
        - PUT /v1/strategy-rule-sets/{id}
        - DELETE /v1/strategy-rule-sets/{id}
        - POST /v1/strategy-rule-sets/{id}/activate
        - GET /v1/strategy-rule-sets/{id}
      events:
        emits: [strategy-rule-set.activated]
      notes:
        - Tabelle `strategy_rule_set`; eindeutiger Teilindex für den aktiven Regelsatz.
    evidence:
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: prüft Regelsätze vollständig beim Speichern
        covers: [rule-set-invalid]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: aktiviert den Entwurf; aktive Regelsätze sind unveränderlich
        covers: [aktiviert, rule-set-not-draft]
      - kind: scenario
        id: putaway-strategy
        covers: [aktiviert, rule-set-invalid]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: liest einen Regelsatz einzeln mit allen Regeln
        covers: [aktiviert]
    comparisons:
      openwms:
        status: neu
        note: Kein Gegenstück im öffentlichen OpenWMS; Putaway- und Picking-Bibliotheken sind privat.
        refs:
          - Analyse 1.1
          - Analyse 5.1b

  - id: strategien.bedingungen
    title: Bedingungen für Regeln
    group: strategien.regelsaetze
    summary: Wählt die passende Regel anhand von Eigenschaften der TU, des Auftrags oder der Anfrage – z. B. „schwere Paletten auf den Boden“.
    description: |
      Bedingungen vergleichen Felder (z. B. `unit.weightKg`, `order.customer`) mit Werten und lassen sich mit
      `all`, `any` und `not` verknüpfen. Dezimalwerte werden exakt verglichen. Bedingungen sind Daten, kein
      ausführbarer Code; Code-artige Inhalte werden schon beim Speichern abgelehnt.
    usage:
      - channel: api
        text: 'Im Regelsatz: `{ "field": "unit.weightKg", "op": "gt", "value": "500" }` oder `{ "all": [ … ] }`.'
    rules:
      - Operatoren `eq`, `neq`, `in`, `notIn`, `gt`, `gte`, `lt`, `lte`, `exists`; Verknüpfungen `all`, `any`, `not`, `always`.
      - Fehlende Fakten gelten als nicht erfüllt (außer bei `neq` und `notIn`).
    acceptance:
      - id: gewaehlt
        kind: effekt
        text: Die Regel wird nach Bedingungen gewählt – eine schwere TU landet auf dem Boden.
      - id: exakt
        kind: regel
        text: Dezimalfelder werden exakt verglichen; `all` und `any` verknüpfen Bedingungen.
      - id: schema
        kind: regel
        text: Unbekannte Schlüssel und Code-artige Inhalte werden schon im Schema abgelehnt.
    dependsOn: [strategien.regelsaetze]
    technical:
      components:
        - apps/api/src/modules/strategy/domain/conditions.ts
        - apps/api/src/modules/strategy/application/decision-engine.ts
    evidence:
      - kind: unit
        file: apps/api/test/unit/strategy/conditions.test.ts
        test: vergleicht Dezimalfelder exakt statt mit Gleitkomma
        rationale: Eine Bedingung liefert einen Wahrheitswert; `toBe(true/false)` ist das fachliche Ergebnis.
        covers: [exakt]
      - kind: unit
        file: apps/api/test/unit/strategy/conditions.test.ts
        test: kombiniert mit all und any
        rationale: Eine Bedingung liefert einen Wahrheitswert; `toBe(true/false)` ist das fachliche Ergebnis.
        covers: [exakt]
      - kind: unit
        file: apps/api/test/unit/strategy/conditions.test.ts
        test: lehnt unbekannte Schlüssel und Code-artige Inhalte schon im Schema ab
        rationale: Die Ablehnung durch das Schema ist das fachliche Ergebnis.
        covers: [schema]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: wählt die Regel nach Bedingungen (schwere TU auf den Boden)
        rationale: Prüft die Regelwahl über die Einlagerentscheidung; Bedingungen haben keinen eigenen Endpunkt.
        covers: [gewaehlt]
    comparisons:
      openwms:
        status: neu
        note: Kein Gegenstück im öffentlichen OpenWMS.
        refs:
          - Analyse 5.1b

  - id: strategien.einlagerplatz
    title: Einlagerplatz automatisch bestimmen
    group: strategien.einlagerung
    summary: Schlägt für eine TU den besten freien Platz vor und reserviert ihn auf Wunsch als Ziel – nach dem aktiven Regelsatz.
    description: |
      Die Einlagerentscheidung ermittelt Fakten zur TU, wählt die erste zutreffende Regel und führt deren Strategie
      aus: `first-free` (erster geeigneter Platz nach Sortierfolge) oder `weighted` (gewichtete Kriterien
      Sortierung, Leere, Vorrang des Platztyps). Harte Regeln – Platzierungsregeln, Sperren, Vergabesperre und bereits
      zugewiesene TUs – kann keine Strategie umgehen. Ergebnis und Begründung werden gespeichert.
    usage:
      - channel: api
        text: "`POST /v1/putaway/decisions` mit `barcode`, optional `group` und `assign: true` (Platz als Ziel setzen)."
      - channel: node-red
        text: Lagerbewegungen und Wareneingang nutzen die Entscheidung, wenn nur eine Zielgruppe angegeben ist.
    rules:
      - Ohne aktiven Regelsatz keine Entscheidung.
      - Plätze mit Vergabesperre (`ALLOCATION_BLOCKED`) oder gemeldeter Anlagenstörung (`PLC_FAULT`) werden nicht vergeben.
      - Bei parallelen Entscheidungen wird jeder Platz nur einmal vergeben (`FOR UPDATE SKIP LOCKED`, bis zu 5 Versuche).
      - Wird kein Platz gefunden, erklärt die Begründung warum.
    acceptance:
      - id: entschieden
        kind: effekt
        text: Die Entscheidung wählt den besten freien Platz nach Vorrang, reserviert ihn auf Wunsch und speichert die Begründung.
      - id: belegt
        kind: effekt
        text: Bereits zugewiesene TUs zählen als belegt.
      - id: harte-regeln
        kind: regel
        text: Harte Regeln lassen sich nicht umgehen; findet sich kein Platz, erklärt die Begründung warum.
      - id: parallel
        kind: regel
        text: Bei parallelen Entscheidungen wird jeder Platz nur einmal vergeben.
      - id: aktiver-regelsatz
        kind: regel
        text: Ohne aktiven Regelsatz gibt es keine Entscheidung.
      - id: allocation-blocked
        kind: regel
        text: Plätze mit Vergabesperre (`ALLOCATION_BLOCKED`) oder gemeldeter Anlagenstörung (`PLC_FAULT`) werden nicht vergeben.
        code: ALLOCATION_BLOCKED
      - id: plc-fault
        kind: regel
        text: Plätze mit Vergabesperre (`ALLOCATION_BLOCKED`) oder gemeldeter Anlagenstörung (`PLC_FAULT`) werden nicht vergeben.
        code: PLC_FAULT
    settings:
      - name: Einlagerstrategie und Parameter
        description: "`first-free` oder `weighted` mit `group`, `includeSubgroups`, `weights` (sortOrder, emptiness, privilege je 0–10)."
        where: Regelsatz für `putaway`
    dependsOn: [strategien.regelsaetze, transporteinheiten.platzierungspruefung]
    technical:
      components:
        - apps/api/src/modules/strategy/putaway/putaway.service.ts
        - apps/api/src/modules/strategy/putaway/putaway-ranking.ts
        - apps/api/src/modules/strategy/putaway/putaway.point.ts
      endpoints:
        - POST /v1/putaway/decisions
      events:
        emits: [putaway.decided]
      notes:
        - Gespeichert in `strategy_decision` mit vollständiger Begründung (Decision Trace).
    evidence:
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: entscheidet, weist zu und speichert die Begründung
        covers: [entschieden]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: zählt bereits zugewiesene TUs als belegt
        covers: [belegt]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: kann harte Regeln nicht umgehen und erklärt, warum nichts gewählt wurde
        covers: [harte-regeln]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: vergibt bei parallelen Entscheidungen jeden Platz nur einmal
        covers: [parallel]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: verlangt einen aktiven Regelsatz
        covers: [aktiver-regelsatz]
      - kind: unit
        file: apps/api/test/unit/strategy/putaway-ranking.test.ts
        test: "Vorrang: bevorzugt den Platztyp mit höherem privilegeLevel"
        covers: [entschieden]
      - kind: scenario
        id: putaway-strategy
        rationale: Das Szenario prüft den Entscheidungspunkt über die Simulation, die dieselbe Strategie ohne Zuweisung ausführt.
        covers: [entschieden, allocation-blocked]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: vergibt keinen Platz, für den die Anlage eine Störung meldet
        rationale: Prüft den Ausschluss gestörter Plätze über die Simulation, die dieselbe Strategie ohne Zuweisung ausführt.
        covers: [plc-fault]
    comparisons:
      openwms:
        status: abweichend
        note: OpenWMS ruft für die Einlagerung einen privaten Putaway-Dienst auf (M-04); hier eigene, konfigurierbare Strategien mit harten Regeln.
        refs:
          - Analyse 3.5 M-04

  - id: strategien.einlager-simulation
    title: Einlagerung simulieren
    group: strategien.einlagerung
    summary: Probiert einen Regelsatz-Entwurf an einer echten TU aus, bevor er aktiv wird – ohne etwas zu speichern oder zuzuweisen.
    description: |
      Die Simulation läuft wie eine echte Entscheidung, auch mit einem Entwurf, speichert aber nichts und weist keinen
      Platz zu. Sie liefert dieselbe Begründung, sodass Wirkung und Nebenwirkungen eines neuen Regelsatzes vorab
      sichtbar sind.
    usage:
      - channel: api
        text: "`POST /v1/putaway/simulations` mit `barcode`, optional `group` und `ruleSetId`."
    acceptance:
      - id: simuliert
        kind: effekt
        text: Die Simulation zeigt das Ergebnis eines Entwurfs an einer echten TU, ohne etwas zu speichern oder zuzuweisen.
    dependsOn: [strategien.einlagerplatz]
    technical:
      components:
        - apps/api/src/modules/strategy/putaway/putaway.service.ts
      endpoints:
        - POST /v1/putaway/simulations
    evidence:
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: legt einen Entwurf an und simuliert ihn, ohne etwas zu speichern
        covers: [simuliert]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: prüft einen neuen Entwurf per Simulation, bevor er aktiv wird
        covers: [simuliert]
      - kind: scenario
        id: putaway-strategy
        covers: [simuliert]
    comparisons:
      openwms:
        status: neu
        note: Kein Gegenstück im öffentlichen OpenWMS.
        refs:
          - Analyse 5.1b

  - id: strategien.auslagerstrategien
    title: Auslagerstrategien (FIFO, FEFO, LIFO, Anbruch, ganze TU)
    group: strategien.auslagerung
    summary: Bestimmt, welcher Bestand für einen Bedarf genommen wird – z. B. frühestes MHD zuerst mit Mindestrestlaufzeit für einen Frischekunden.
    description: |
      Für einen Bedarf (Produkt, Menge, optional Charge, Kunde, Priorität) plant die Auslagerentscheidung Posten und
      Mengen in der Reihenfolge der gewählten Strategie und meldet eine Fehlmenge. Harte Regeln schließen nicht
      verfügbaren Bestand aus: gesperrte TUs und Plätze, laufende Inventur, zu kurze Restlaufzeit, falsche Charge.
      Die Simulation zeigt den Plan mit Begründung, ohne zu reservieren; echte Entscheidungen trifft der Auslagerauftrag.
    usage:
      - channel: api
        text: "Simulation `POST /v1/allocation/simulations` mit `sku`, `quantity`, optional `lot`, `customer`, `orderPriority`, `ruleSetId`."
    rules:
      - Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
      - Vor einer echten Entscheidung werden alle TUs des Produkts gesperrt; gleichzeitige Zuteilungen planen nie denselben Bestand.
    acceptance:
      - id: rangfolge
        kind: effekt
        text: FEFO nimmt das früheste MHD zuerst, „ganze TU“ möglichst ganze Posten; die Simulation begründet, ohne zu reservieren.
      - id: fehlmenge
        kind: effekt
        text: Fehlmenge und Begründung werden gemeldet, ungeeignete Posten ignoriert.
      - id: not-available
        kind: regel
        text: Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
        code: NOT_AVAILABLE
      - id: unit-not-available
        kind: regel
        text: Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
        code: UNIT_NOT_AVAILABLE
      - id: source-outbound-blocked
        kind: regel
        text: Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
        code: SOURCE_OUTBOUND_BLOCKED
      - id: count-in-progress
        kind: regel
        text: Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
        code: COUNT_IN_PROGRESS
      - id: remaining-shelf-life
        kind: regel
        text: Harte Regeln `NOT_AVAILABLE`, `UNIT_NOT_AVAILABLE`, `SOURCE_OUTBOUND_BLOCKED`, `COUNT_IN_PROGRESS`, `REMAINING_SHELF_LIFE`.
        code: REMAINING_SHELF_LIFE
    settings:
      - name: Auslagerstrategie und Parameter
        description: "`fifo`, `fefo`, `lifo`, `partial-first`, `full-unit` mit `group`, `includeSubgroups`, `minRemainingDays`."
        where: Regelsatz für `allocation`
    dependsOn: [strategien.regelsaetze, bestand.bestand-je-tu]
    technical:
      components:
        - apps/api/src/modules/strategy/allocation/allocation.service.ts
        - apps/api/src/modules/strategy/allocation/allocation-ranking.ts
        - apps/api/src/modules/strategy/allocation/allocation.point.ts
      endpoints:
        - POST /v1/allocation/simulations
      events:
        emits: [allocation.decided]
    evidence:
      - kind: unit
        file: apps/api/test/unit/strategy/allocation-ranking.test.ts
        test: "FEFO: frühestes MHD zuerst, ohne MHD zuletzt"
        covers: [rangfolge]
      - kind: unit
        file: apps/api/test/unit/strategy/allocation-ranking.test.ts
        test: "Ganze TU bevorzugen: möglichst ganze Posten, Rest vom kleinsten deckenden"
        covers: [rangfolge]
      - kind: unit
        file: apps/api/test/unit/strategy/allocation-ranking.test.ts
        test: meldet Fehlmenge und Begründung, ignoriert ungeeignete Posten
        covers: [fehlmenge, source-outbound-blocked]
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: simuliert mit Begründung, ohne zu reservieren
        covers: [rangfolge, remaining-shelf-life]
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: teilt per FEFO mit Mindestrestlaufzeit zu und reserviert
        covers: [rangfolge]
      - kind: scenario
        id: outbound-flow
        covers: [rangfolge]
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: nimmt keinen Bestand von gesperrten Plätzen, gesperrten TUs oder aus laufender Inventur
        covers: [not-available, unit-not-available, source-outbound-blocked, count-in-progress]
    comparisons:
      openwms:
        status: erweitert
        note: Öffentlich nur eine einfache TU-Allokation (/allocation/generic); Picking-Bibliothek privat. Hier FIFO, FEFO, LIFO, Anbruch, ganze TU mit Restlaufzeit.
        refs:
          - Analyse 3.3 /allocation/generic

  - id: strategien.entscheidungsprotokoll
    title: Entscheidungen nachvollziehen
    group: strategien.nachvollziehbarkeit
    summary: Beantwortet „Warum kam die Palette auf diesen Platz?“ – mit Regel, Strategie, Fakten und bewerteten Kandidaten.
    description: |
      Jede echte Einlager- und Auslagerentscheidung wird mit Begründung gespeichert: gewählte Regel, Strategie mit
      Parametern, Fakten, gewählter Kandidat mit Punktzahl, Zusammenfassung und bis zu 20 Kandidaten mit Verstößen
      bzw. Bewertungsanteilen. Entscheidungen lassen sich je TU oder Auftrag abrufen.
    usage:
      - channel: api
        text: "`GET /v1/strategy-decisions?subject=<barcode>`, `GET /v1/strategy-decisions/{id}`"
    acceptance:
      - id: protokoll
        kind: effekt
        text: Gespeicherte Entscheidungen sind je TU mit Regel, Strategie, Fakten und Kandidaten abrufbar.
    dependsOn: [strategien.einlagerplatz]
    technical:
      components:
        - apps/api/src/modules/strategy/application/decision.service.ts
        - apps/api/src/modules/strategy/entities/decision.entity.ts
      endpoints:
        - GET /v1/strategy-decisions
        - GET /v1/strategy-decisions/{id}
    evidence:
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: listet gespeicherte Entscheidungen je TU
        covers: [protokoll]
      - kind: integration
        file: apps/api/test/integration/strategy.integration.test.ts
        test: entscheidet, weist zu und speichert die Begründung
        covers: [protokoll]
    comparisons:
      openwms:
        status: neu
        note: OpenWMS speichert keine Begründung von Entscheidungen.
        refs:
          - Analyse 5.1b
