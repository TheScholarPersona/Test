# Feature-Katalog – Bereich Sicherheit und Betrieb.
area: sicherheit

features:
  - id: sicherheit.anmeldung
    title: Anmeldung mit Benutzer und Passwort
    group: sicherheit.zugang
    summary: Schützt Oberfläche und API – ohne Anmeldung sind nur Betriebszustand, API-Beschreibung und die Anmeldeseite erreichbar.
    description: |
      Benutzer melden sich mit Name und Passwort an und erhalten eine Sitzung als Cookie (HttpOnly, SameSite=Strict,
      12 Stunden). Abmelden beendet die Sitzung. Falsche Angaben werden einheitlich gemeldet, egal ob der Benutzer
      existiert; nach fünf Fehlversuchen ist der Benutzer fünf Minuten gesperrt. Der Benutzer `admin` wird beim
      ersten Start aus der Konfiguration angelegt.
    usage:
      - channel: leitstand
        text: Anmeldeseite beim Öffnen der Oberfläche; „Abmelden“ oben rechts.
      - channel: api
        text: "`POST /v1/auth/login`, `POST /v1/auth/logout`, `GET /v1/auth/me`."
    rules:
      - Passwörter mit scrypt gespeichert, Sitzungen nur als Hash des Tokens.
      - Fünf Fehlversuche → fünf Minuten Sperre (`LOGIN_LOCKED`).
    acceptance:
      - id: geschuetzt
        kind: effekt
        text: Ohne Anmeldung sind nur Betriebszustand, API-Beschreibung und Anmeldung erreichbar; nach Anmeldung per Cookie die übrige API.
      - id: einheitlich
        kind: regel
        text: Falsche Anmeldedaten werden einheitlich gemeldet.
      - id: login-locked
        kind: regel
        text: Fünf Fehlversuche → fünf Minuten Sperre (`LOGIN_LOCKED`).
        code: LOGIN_LOCKED
    settings:
      - name: Sitzungsdauer und Cookie
        description: "`AUTH_SESSION_HOURS` (Standard 12), `AUTH_COOKIE_SECURE` (auto | true | false)."
        where: Umgebungsvariablen der API
      - name: Startpasswort admin
        description: "`AUTH_ADMIN_PASSWORD` bzw. `WMS_ADMIN_PASSWORD` in der .env."
        where: .env
    technical:
      components:
        - apps/api/src/modules/auth/application/auth.service.ts
        - apps/api/src/modules/auth/application/login-throttle.ts
        - apps/api/src/modules/auth/http/auth.controller.ts
        - apps/api/src/modules/auth/http/auth.guard.ts
        - apps/web/src/auth/session.tsx
      endpoints:
        - POST /v1/auth/login
        - POST /v1/auth/logout
        - GET /v1/auth/me
      notes:
        - Tabellen `app_user` und `app_session`.
    evidence:
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: lässt ohne Anmeldung nur Öffentliches zu
        rationale: Prüft öffentliche und geschützte Endpunkte ohne Anmeldung – die Regel betrifft alle Endpunkte, nicht nur die der Anmeldung.
        covers: [geschuetzt]
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: legt admin aus der Konfiguration an und meldet per Cookie an
        covers: [geschuetzt]
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: meldet falsche Anmeldedaten einheitlich und bremst nach fünf Fehlversuchen
        covers: [einheitlich, login-locked]
      - kind: web-e2e
        file: apps/web/e2e/auth.spec.ts
        test: "Anmeldung: falsches Passwort, Anmelden, Abmelden"
        rationale: Browser-Test über die Anmeldeseite; die Seite ist keine katalogisierte Route des Features.
        covers: [geschuetzt, einheitlich]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Common und TMS nutzen Spring Security; Identitätsdienst und Konfiguration liegen nicht in den öffentlichen Repositories.
        refs:
          - Analyse 1.3

  - id: sicherheit.rollen
    title: Rollen und Rechte
    group: sicherheit.zugang
    summary: Fünf Rollen (admin, leitstand, lager, anlage, lesen) legen fest, wer was darf; jede Änderung nennt ihren Auslöser.
    description: |
      Eine zentrale Rechtetabelle ordnet jedem Endpunkt die erlaubten Rollen zu. Lesen darf jede angemeldete Rolle;
      ändernde Anfragen brauchen eine ausdrücklich passende Regel, sonst nur `admin` (sicherer Standard für neue
      Endpunkte). Fehlende Rechte werden mit `403` und den nötigen Rollen beantwortet. Ereignisse tragen den
      Auslöser (`user:<name>` bzw. `service:<name>`).
    usage:
      - channel: api
        text: Wirkt automatisch; `GET /v1/auth/me` zeigt die eigenen Rollen.
    rules:
      - "`admin`: alles; `leitstand`: Aufträge steuern, Sperren, Korrekturen, Inventur; `lager`: Arbeit am Scanner; `anlage`: Geräte-Ereignisse und Transporte; `lesen`: nur ansehen."
    acceptance:
      - id: rechtetabelle
        kind: regel
        text: Jede Rolle darf nur, was die Rechtetabelle vorsieht; die Rolle lesen ändert nichts.
      - id: akteur
        kind: effekt
        text: Jede Änderung vermerkt ihren Akteur.
    technical:
      components:
        - apps/api/src/modules/auth/domain/policy.ts
        - apps/api/src/modules/auth/http/auth.guard.ts
        - apps/api/src/common/request-context.ts
    evidence:
      - kind: unit
        file: apps/api/test/unit/auth/policy.test.ts
        test: lässt die Rolle lesen nichts ändern
        rationale: Die Rechteprüfung liefert einen Wahrheitswert; `toBe(false)` je Aktion ist das fachliche Ergebnis.
        covers: [rechtetabelle]
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: erlaubt je Rolle nur, was die Rechtetabelle vorsieht, und vermerkt den Akteur
        rationale: Querschnittsfunktion; geprüft über Aufrufe mit verschiedenen Rollen und den vermerkten Akteur.
        covers: [rechtetabelle, akteur]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Common und TMS nutzen Spring Security; Rollenmodell nicht in den öffentlichen Repositories.
        refs:
          - Analyse 1.3

  - id: sicherheit.service-tokens
    title: Service-Tokens für Anlagen und Node-RED
    group: sicherheit.zugang
    summary: Maschinen melden sich mit einem eigenen Token und eigener Rolle an – ohne Benutzerkonto.
    description: |
      Service-Tokens werden in der Konfiguration mit Name und Rollen hinterlegt und als `Authorization: Bearer …`
      gesendet. Node-RED nutzt so ein Token für Szenarien, Simulator und Beispiel-Flows.
    usage:
      - channel: api
        text: "Header `Authorization: Bearer <token>`."
      - channel: node-red
        text: Verbindung `wms-config` liest das Token aus `WMS_API_TOKEN`.
    acceptance:
      - id: token
        kind: effekt
        text: Ein Service-Token meldet eine Maschine mit eigener Rolle an; Node-RED nimmt es aus der Umgebung.
    settings:
      - name: Tokens und Rollen
        description: "`AUTH_SERVICE_TOKENS=\"name:rolle+rolle:token;…\"` (Token mindestens 32 Zeichen)."
        where: Umgebungsvariable der API
    technical:
      components:
        - apps/api/src/modules/auth/application/auth.service.ts
        - apps/api/src/config.ts
        - packages/node-red-nodes/nodes/wms-config.js
    evidence:
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: erlaubt je Rolle nur, was die Rechtetabelle vorsieht, und vermerkt den Akteur
        rationale: Querschnittsfunktion; geprüft über Aufrufe mit Service-Token und den vermerkten Akteur.
        covers: [token]
      - kind: unit
        file: packages/node-red-nodes/test/nodes.test.mjs
        test: meldet sich mit dem Service-Token aus der Umgebung an
        rationale: Prüft die Anmeldung des Node-RED-Nodes mit dem Service-Token aus der Umgebung.
        covers: [token]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Absicherung der Dienst-zu-Dienst-Aufrufe nicht in den öffentlichen Repositories.
        refs:
          - Analyse 1.3

  - id: sicherheit.benutzerverwaltung
    title: Benutzer verwalten
    group: sicherheit.benutzer
    summary: Admins legen Benutzer an, vergeben Rollen, sperren sie oder setzen Passwörter – betroffene Sitzungen enden sofort.
    description: |
      Benutzer haben Namen, Anzeigename, Rollen und einen Aktiv-Status. Rollenwechsel, Sperren und neues Passwort
      beenden alle Sitzungen des Benutzers. Ein Admin kann sich nicht selbst aussperren.
    usage:
      - channel: api
        text: "`GET /v1/users`, `POST /v1/users`, `PATCH /v1/users/{username}`, Rollen mit Beschreibung `GET /v1/auth/roles`."
      - channel: leitstand
        text: Seite **Benutzer** (nur admin) – anlegen, Rollen ankreuzen, sperren, Passwort setzen.
    rules:
      - Benutzername eindeutig; nur bekannte Rollen; Passwort mindestens 10 Zeichen.
      - Keine Selbstaussperrung (`SELF_LOCKOUT`).
    acceptance:
      - id: angelegt
        kind: effekt
        text: Admins legen Benutzer mit Rollen an und sehen die Rollen mit Beschreibung.
      - id: sitzungen
        kind: effekt
        text: Sperren und Rollenwechsel beenden die Sitzungen des Benutzers sofort.
      - id: self-lockout
        kind: regel
        text: Keine Selbstaussperrung (`SELF_LOCKOUT`).
        code: SELF_LOCKOUT
    technical:
      components:
        - apps/api/src/modules/auth/application/auth.service.ts
        - apps/api/src/modules/auth/http/users.controller.ts
        - apps/web/src/pages/UsersPage.tsx
      endpoints:
        - GET /v1/users
        - POST /v1/users
        - PATCH /v1/users/{username}
        - GET /v1/auth/roles
      uiRoutes:
        - /benutzer
    evidence:
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: beendet Sitzungen beim Abmelden, beim Sperren und beim Rollenwechsel
        covers: [sitzungen]
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: ändert das eigene Passwort und schützt vor Selbstaussperrung
        covers: [self-lockout]
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: liefert die Rollen mit Beschreibung
        covers: [angelegt]
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Benutzer: anlegen mit Rolle, Rollen ansehen, sperren"
        covers: [angelegt, sitzungen]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Benutzerverwaltung nicht in den öffentlichen Repositories.
        refs:
          - Analyse 1.1

  - id: sicherheit.eigenes-passwort
    title: Eigenes Passwort ändern
    group: sicherheit.benutzer
    summary: Jeder Benutzer ändert sein Passwort selbst; andere Sitzungen werden dabei beendet.
    description: Die Änderung verlangt das aktuelle Passwort und beendet alle anderen Sitzungen des Benutzers.
    usage:
      - channel: api
        text: "`POST /v1/auth/password` mit `currentPassword` und `newPassword`."
      - channel: leitstand
        text: Seite **Konto** (Link beim Anmeldenamen).
    rules:
      - Mindestens 10 Zeichen (`PASSWORD_TOO_SHORT`).
    acceptance:
      - id: geaendert
        kind: effekt
        text: Das eigene Passwort lässt sich ändern; danach gilt nur noch das neue.
      - id: password-too-short
        kind: regel
        text: Mindestens 10 Zeichen (`PASSWORD_TOO_SHORT`).
        code: PASSWORD_TOO_SHORT
    technical:
      components:
        - apps/api/src/modules/auth/application/auth.service.ts
        - apps/api/src/modules/auth/domain/password.ts
        - apps/web/src/pages/AccountPage.tsx
      endpoints:
        - POST /v1/auth/password
      uiRoutes:
        - /konto
    evidence:
      - kind: integration
        file: apps/api/test/integration/auth.integration.test.ts
        test: ändert das eigene Passwort und schützt vor Selbstaussperrung
        covers: [geaendert, password-too-short]
      - kind: web-e2e
        file: apps/web/e2e/auth.spec.ts
        test: "Konto: eigenes Passwort ändern und mit dem neuen anmelden"
        covers: [geaendert]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Benutzerverwaltung nicht in den öffentlichen Repositories.
        refs:
          - Analyse 1.1

  - id: sicherheit.node-red-schutz
    title: Geschützter Node-RED-Editor und Endpunkte
    group: sicherheit.infrastruktur
    summary: Der Node-RED-Editor und die Test- und Simulator-Endpunkte verlangen eine Anmeldung.
    description: |
      Der Editor und die Admin-API von Node-RED verlangen den Benutzer `admin`, die HTTP-Endpunkte der Flows
      (`/test`, `/sim`, `/examples`) den Benutzer `wms` (Basic Auth). Passwörter kommen aus der .env.
    usage:
      - channel: node-red
        text: "Editor-Anmeldung `admin` / `WMS_NODE_RED_ADMIN_PASSWORD`."
    acceptance:
      - id: anmeldung
        kind: effekt
        text: Aufrufe von Editor, Test- und Simulator-Endpunkten ohne Anmeldung werden abgelehnt.
    settings:
      - name: Passwörter
        description: "`WMS_NODE_RED_ADMIN_PASSWORD`, `WMS_NODE_RED_HTTP_PASSWORD` – erzeugt von `pnpm env:init`."
        where: .env
    technical:
      components:
        - docker/node-red/settings.js
        - scripts/init-env.mjs
    evidence:
      - kind: integration
        file: packages/scenario-runner/test/scenarios.test.ts
        test: lehnt Aufrufe ohne Anmeldung ab
        rationale: Die Ablehnung mit 401 ohne Anmeldung ist das fachliche Ergebnis; Node-RED hat keinen katalogisierten WMS-Endpunkt.
        covers: [anmeldung]
    comparisons:
      openwms:
        status: neu
        note: OpenWMS nutzt kein Node-RED.
        refs:
          - Analyse 5.1a

  - id: sicherheit.betriebszustand
    title: Betriebszustand abfragen
    group: sicherheit.betrieb
    summary: Meldet, ob Datenbank und MQTT erreichbar sind – für Monitoring und Healthchecks.
    description: Der Endpunkt ist ohne Anmeldung erreichbar und liefert den Zustand der Datenbank- und der MQTT-Verbindung.
    usage:
      - channel: api
        text: "`GET /health`"
    acceptance:
      - id: erreichbar
        kind: effekt
        text: "`/health` meldet Datenbank und MQTT als erreichbar."
    technical:
      components:
        - apps/api/src/modules/health/health.controller.ts
      endpoints:
        - GET /health
    evidence:
      - kind: integration
        file: apps/api/test/integration/api.integration.test.ts
        test: meldet Datenbank und MQTT als erreichbar
        covers: [erreichbar]
    comparisons:
      openwms:
        status: gleichwertig
        note: Entspricht dem Healthcheck der Spring-Boot-Dienste (Actuator).
        refs:
          - Analyse 1.3

  - id: sicherheit.metriken
    title: Metriken für Prometheus
    group: sicherheit.betrieb
    summary: Liefert Kennzahlen zu Anfragen, Antwortzeiten, Event-Versand und offenen Aufträgen für Prometheus und Grafana.
    description: |
      `GET /metrics` liefert Prometheus-Text: Dauer und Anzahl der HTTP-Anfragen je Methode, Routenmuster und Status;
      veröffentlichte und fehlgeschlagene Events je Typ, Outbox-Rückstand und Alter des ältesten offenen Events; offene
      Auslageraufträge, Picks, Avise, Lagerbewegungen, Transportaufträge, Sendungen und TU-Fehlermeldungen je Zustand;
      Prozesswerte von Node.js (CPU, Speicher, Event-Loop). Zustände werden beim Abruf aus der Datenbank gelesen.
    usage:
      - channel: api
        text: "`GET /metrics` mit Anmeldung, z. B. Prometheus mit einem Service-Token der Rolle `lesen` (`authorization: Bearer …`)."
    rules:
      - Nur angemeldet (401 sonst); Routen werden als Muster erfasst (`/v1/shipments/:number`), damit die Zahl der Zeitreihen klein bleibt.
    acceptance:
      - id: prometheus
        kind: effekt
        text: "`/metrics` liefert Kennzahlen im Prometheus-Format mit Routen als Muster."
      - id: anmeldung
        kind: regel
        text: Ohne Anmeldung antwortet `/metrics` mit 401.
    dependsOn: [sicherheit.service-tokens]
    technical:
      components:
        - apps/api/src/infrastructure/metrics/metrics.service.ts
        - apps/api/src/infrastructure/metrics/metrics.controller.ts
        - apps/api/src/infrastructure/metrics/http-metrics.ts
      endpoints:
        - GET /metrics
      notes:
        - prom-client 15.1.3 (Apache-2.0); Präfix `wms_`.
    evidence:
      - kind: integration
        file: apps/api/test/integration/api.integration.test.ts
        test: liefert Metriken im Prometheus-Format nur mit Anmeldung
        covers: [prometheus, anmeldung]
    comparisons:
      openwms:
        status: gleichwertig
        note: Entspricht Micrometer/Prometheus der Spring-Boot-Dienste; verteiltes Tracing (OpenTelemetry) fehlt noch.
        refs:
          - Analyse 1.3

  - id: sicherheit.outbox-aufbewahrung
    title: Aufbewahrungsfrist für versendete Events
    group: sicherheit.betrieb
    summary: Löscht veröffentlichte Events nach einer einstellbaren Frist, damit die Outbox-Tabelle nicht unbegrenzt wächst.
    description: |
      Ein Hintergrunddienst löscht veröffentlichte Outbox-Einträge, die älter als `OUTBOX_RETENTION_HOURS` sind (Standard
      7 Tage, 0 = nie), stündlich in Portionen. Unveröffentlichte Events bleiben immer erhalten. Die Zahl der gelöschten
      Einträge erscheint als Metrik.
    usage:
      - channel: api
        text: Konfiguration `OUTBOX_RETENTION_HOURS` und `OUTBOX_CLEANUP_INTERVAL_MS`; Metrik `wms_outbox_cleaned_total`.
    acceptance:
      - id: geloescht
        kind: effekt
        text: Veröffentlichte Einträge werden nach der Frist gelöscht, unveröffentlichte nie.
    dependsOn: [integration.ereignisse]
    technical:
      components:
        - apps/api/src/infrastructure/outbox/outbox-cleanup.service.ts
    evidence:
      - kind: integration
        file: apps/api/test/integration/api.integration.test.ts
        test: löscht veröffentlichte Einträge nach der Aufbewahrungsfrist, unveröffentlichte nie
        covers: [geloescht]
    comparisons:
      openwms:
        status: neu
        note: OpenWMS nutzt AMQP ohne eigene Outbox-Tabelle; Aufbewahrung ist dort Sache des Brokers.
        refs:
          - Analyse 1.3

  - id: sicherheit.migrationen
    title: Datenbankschema automatisch aktuell halten
    group: sicherheit.betrieb
    summary: Bringt die Datenbank beim Start auf den neuesten Stand – wiederholbar und ohne Handarbeit.
    description: Versionierte Migrationen legen das Schema an und aktualisieren es; ein erneuter Lauf ändert nichts.
    usage:
      - channel: api
        text: "`DB_MIGRATE_ON_START=true` oder `pnpm --filter @wms/api db:migrate`."
    acceptance:
      - id: schema
        kind: effekt
        text: Die Migrationen legen das Schema an und lassen sich wiederholt ausführen.
    technical:
      components:
        - apps/api/src/infrastructure/database/migrate.ts
        - apps/api/src/migrations
    evidence:
      - kind: integration
        file: apps/api/test/integration/api.integration.test.ts
        test: legen das Schema an und sind wiederholbar
        covers: [schema]
    comparisons:
      openwms:
        status: erweitert
        note: OpenWMS erzeugt das Schema per Hibernate ddl-auto; hier versionierte, wiederholbare Migrationen.
        refs:
          - Analyse 5.4 Nr. 8

  - id: sicherheit.mqtt-tls
    title: MQTT nur mit TLS, Benutzern und Rechten je Topic
    group: sicherheit.infrastruktur
    summary: Der Broker nimmt nur verschlüsselte, angemeldete Verbindungen an – und nur das WMS darf WMS-Ereignisse veröffentlichen.
    description: |
      Mosquitto lauscht nur auf Port 8883 (TLS) ohne anonyme Zugriffe. Benutzer `wms-api`, `node-red` und `health`
      haben Rechte je Topic (ACL): Node-RED liest `wms/#` und schreibt nur unter `plant/#`. Zertifizierungsstelle
      und Serverzertifikat erzeugt der Dienst `certs` beim ersten Start; Passwörter kommen aus der .env.
    usage:
      - channel: mqtt
        text: "`mqtts://localhost:8883` mit `--cafile ca.crt` und Benutzer (siehe docs/entwicklung.md, Absicherung)."
    acceptance:
      - id: verbindung
        kind: effekt
        text: Eine Verbindung mit Benutzer, Passwort und gültigem Zertifikat gelingt.
      - id: nur-tls
        kind: regel
        text: Verbindungen ohne TLS, anonyme Zugriffe, falsche Passwörter und fremde Server-Zertifikate werden abgelehnt.
      - id: topic-rechte
        kind: regel
        text: Node-RED darf keine Ereignisse des WMS veröffentlichen.
    settings:
      - name: Passwörter
        description: "`WMS_MQTT_API_PASSWORD`, `WMS_MQTT_NODE_RED_PASSWORD`, `WMS_MQTT_HEALTH_PASSWORD`."
        where: .env
      - name: Rechte je Topic
        description: ACL je Benutzer.
        where: docker/mosquitto/acl
    technical:
      components:
        - docker/mosquitto/mosquitto.conf
        - docker/mosquitto/acl
        - docker/mosquitto/start.sh
        - docker/certs/generate.sh
    evidence:
      - kind: integration
        file: packages/scenario-runner/test/security.test.ts
        test: verbindet mit Benutzer, Passwort und gültigem Zertifikat
        rationale: Prüft den Broker direkt über MQTT – das Feature hat keinen HTTP-Endpunkt, Bezug ist die Broker-Konfiguration.
        covers: [verbindung]
      - kind: integration
        file: packages/scenario-runner/test/security.test.ts
        test: lehnt Verbindungen ohne TLS ab
        rationale: Prüft den Broker direkt über MQTT – das Feature hat keinen HTTP-Endpunkt, Bezug ist die Broker-Konfiguration.
        covers: [nur-tls]
      - kind: integration
        file: packages/scenario-runner/test/security.test.ts
        test: lehnt anonyme Zugriffe und falsche Passwörter ab
        rationale: Prüft den Broker direkt über MQTT – das Feature hat keinen HTTP-Endpunkt, Bezug ist die Broker-Konfiguration.
        covers: [nur-tls]
      - kind: integration
        file: packages/scenario-runner/test/security.test.ts
        test: lehnt einen Server ab, dessen Zertifikat nicht von der eigenen Zertifizierungsstelle stammt
        rationale: Prüft den Broker direkt über MQTT – das Feature hat keinen HTTP-Endpunkt, Bezug ist die Broker-Konfiguration.
        covers: [nur-tls]
      - kind: integration
        file: packages/scenario-runner/test/security.test.ts
        test: erlaubt Node-RED nicht, Ereignisse des WMS zu veröffentlichen (Rechte je Topic)
        rationale: Prüft den Broker direkt über MQTT – das Feature hat keinen HTTP-Endpunkt, Bezug ist die Broker-Konfiguration.
        covers: [topic-rechte]
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: OpenWMS nutzt RabbitMQ; dessen Absicherung steht in der nicht öffentlichen Konfiguration (Spring Cloud Config).
        refs:
          - Analyse 1.3
