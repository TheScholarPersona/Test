# Feature-Katalog – Bereich Materialfluss und Anlagen.
area: materialfluss

features:
  - id: materialfluss.routen
    title: Routen und Fahrschritte konfigurieren
    group: materialfluss.konfiguration
    summary: Beschreibt, wie Paletten über die Fördertechnik von einer Quelle zu einem Ziel kommen – Änderungen wirken sofort.
    description: |
      Eine Route verbindet Quelle und Ziel (je Platz oder Gruppe) und enthält eine Nächster-Schritt-Tabelle: Steht die
      TU auf `from`, fährt sie nach `next`; Schritte können für einen TU-Typ gelten und haben dann Vorrang.
      Gefunden wird die spezifischste Route (Platz vor Gruppe vor Elterngruppen). Routen lassen sich abschalten,
      ändern und löschen; es gibt keinen Zwischenspeicher.
    usage:
      - channel: api
        text: "`POST /v1/flow/routes`, Liste `GET /v1/flow/routes`, `GET …/{routeId}`, `PATCH`, `DELETE`, Schritte ersetzen `PUT …/{routeId}/steps`."
      - channel: leitstand
        text: Seite **Materialfluss** – Routen mit Schritten ansehen.
    rules:
      - Routen mit Actions und Plätze in Routen, Schritten oder Actions sind vor dem Löschen geschützt (`ROUTE_IN_USE`).
    dependsOn: [lagerstruktur.plaetze]
    technical:
      components:
        - apps/api/src/modules/flow/application/flow-config.service.ts
        - apps/api/src/modules/flow/domain/matching.ts
        - apps/api/src/modules/flow/http/flow.controller.ts
      endpoints:
        - POST /v1/flow/routes
        - GET /v1/flow/routes/{routeId}
        - PATCH /v1/flow/routes/{routeId}
        - DELETE /v1/flow/routes/{routeId}
        - PUT /v1/flow/routes/{routeId}/steps
        - GET /v1/flow/routes
      events:
        emits: [flow.config-changed]
      uiRoutes:
        - /materialfluss
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: listet Programme mit Parameter-Schema und die Route mit Schritten
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: nimmt für den TU-Typ den speziellen Schritt
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: wendet geänderte Schritte sofort an
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: findet keine Route, wenn sie abgeschaltet ist
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: schützt verwendete Plätze und Routen vor dem Löschen
      - kind: unit
        file: apps/api/test/unit/flow/matching.test.ts
        test: ordnet Platz vor Gruppe vor Elterngruppen
      - kind: scenario
        id: material-flow
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: listet Routen und Actions und ändert eine Action
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Materialfluss: Konfiguration ansehen und Geräte-Ereignis im Probelauf senden"
    comparisons:
      openwms:
        status: erweitert
        note: Routen mit Nächster-Schritt-Tabelle und Suche vom Spezifischen zum Allgemeinen wie im TMS-Routing; zusätzlich Schritte je TU-Typ. Änderungen wirken sofort – OpenWMS hält Routen und Gruppen in Zwischenspeichern, die nach Änderungen veralten (R1, R2).
        refs:
          - Analyse 3.7 Route-Suche, Nächster Schritt, Schwachstellen R1, R2

  - id: materialfluss.action-matrix
    title: Action-Matrix und Programme
    group: materialfluss.konfiguration
    summary: Legt fest, was bei einem Geräte-Ereignis an einem Platz passiert – von „nächster Schritt“ bis „an Node-RED übergeben“.
    description: |
      Eine Action ordnet einem Ereignistyp – optional je Route und Platz oder Gruppe – ein Programm mit Parametern zu.
      Eingebaute Programme: `route-next`, `create-order`, `send-to`, `book`, `finish-order`, `lock-location`,
      `lock-group`, `interrupt-order`, `node-red`. Parameter werden gegen das Schema des Programms geprüft. Gesucht wird vom
      Spezifischen zum Allgemeinen (Platz vor Gruppe vor überall, Route vor routenunabhängig).
    usage:
      - channel: api
        text: "`POST /v1/flow/actions` (`eventType`, `routeId?`, `place?`, `program`, `params`), Liste `GET /v1/flow/actions`, ändern `PATCH …/{name}` (`description`, `params`, `enabled`), `DELETE …/{name}`, Programme `GET /v1/flow/programs`."
      - channel: leitstand
        text: Seite **Materialfluss** – Action-Matrix ansehen.
    settings:
      - name: Programm und Parameter je Ereignis und Ort
        description: z. B. `create-order` am I-Punkt mit `typeCode` und `target`.
        where: "POST /v1/flow/actions"
    dependsOn: [materialfluss.routen]
    technical:
      components:
        - apps/api/src/modules/flow/application/flow-config.service.ts
        - apps/api/src/modules/flow/domain/programs.ts
        - apps/api/src/modules/flow/domain/matching.ts
      endpoints:
        - POST /v1/flow/actions
        - DELETE /v1/flow/actions/{name}
        - GET /v1/flow/programs
        - GET /v1/flow/actions
        - PATCH /v1/flow/actions/{name}
      events:
        emits: [flow.config-changed]
      uiRoutes:
        - /materialfluss
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: prüft Programmparameter, Ereignistyp und Verweise
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: listet Programme mit Parameter-Schema und die Route mit Schritten
      - kind: unit
        file: apps/api/test/unit/flow/matching.test.ts
        test: "Ort vor Route: Platz+Route, Platz, Gruppe+Route, Gruppe, Eltern …, überall+Route, überall"
      - kind: scenario
        id: material-flow
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: listet Routen und Actions und ändert eine Action
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Materialfluss: Konfiguration ansehen und Geräte-Ereignis im Probelauf senden"
    comparisons:
      openwms:
        status: abweichend
        note: Action-Matrix wie im TMS-Routing, aber mit eingebauten Programmen statt BPMN-Workflows (Activiti/Flowable).
        refs:
          - Analyse 3.7 Action-Matrix, Workflows

  - id: materialfluss.geraete-ereignisse
    title: Geräte-Ereignisse verarbeiten und Fahrbefehle senden
    group: materialfluss.betrieb
    summary: Die Anlage meldet „Palette steht an Platz X“, das WMS entscheidet und antwortet mit dem nächsten Fahrbefehl.
    description: |
      Geräte-Ereignisse (`request`, `arrived`, `location-status`, `error`) adressieren Plätze über ihren
      SPS-Code. Das WMS sucht Route und Action, führt das Programm aus, bucht die TU, schließt Aufträge am Ziel ab und
      sendet den Fahrbefehl als Antwort und als Ereignis. Platzmeldungen werden zu Sperren, Störungen unterbrechen den
      laufenden Auftrag. Unabhängig von der Action-Matrix setzt `location-status` mit `plcState` den Anlagenzustand des
      Platzes, und `error` mit Barcode erfasst eine Fehlermeldung an der TU. Am I-Punkt entstehen unbekannte TUs und ihr
      Auftrag automatisch. Ein Probelauf entscheidet
      und begründet, ohne zu buchen oder zu senden.
    usage:
      - channel: api
        text: '`POST /v1/flow/events` mit z. B. `{ "type": "request", "location": { "plcCode": "CV01" }, "barcode": "P1" }`, optional `dryRun: true`.'
      - channel: node-red
        text: Node `wms-device-event`; der Anlagensimulator in Node-RED fährt TUs auf jeden Fahrbefehl.
      - channel: mqtt
        text: Fahrbefehle als Ereignis `flow.command`.
      - channel: leitstand
        text: Seite **Materialfluss** – Geräte-Ereignis von Hand senden, standardmäßig als Probelauf mit Begründung.
    rules:
      - Nichts wird still ignoriert – keine Route erzeugt `flow.no-route`, keine Action `flow.unhandled` (R4).
      - Fachfehler eines Programms brechen ab und kommen als HTTP-Fehler zurück.
    dependsOn: [materialfluss.action-matrix, transportauftraege.anlegen-starten]
    technical:
      components:
        - apps/api/src/modules/flow/application/flow.service.ts
        - apps/api/src/modules/flow/domain/programs.ts
        - packages/node-red-nodes/nodes/wms-device-event.js
        - flows/simulator/config.json
        - apps/web/src/pages/FlowPage.tsx
      endpoints:
        - POST /v1/flow/events
      events:
        emits: [flow.command, flow.no-route, flow.unhandled]
      nodeRedNodes: [wms-device-event]
      uiRoutes:
        - /materialfluss
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: legt am I-Punkt TU und Auftrag an und schickt die TU zum ersten Schritt
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: fährt Schritt für Schritt und schließt bei Ankunft in der Zielgruppe ab
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: bucht und sendet im Probelauf nichts, begründet aber
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: meldet „keine Route“ für einen Auftrag ohne passende Route (R4)
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: meldet „keine Action“, wenn nichts konfiguriert ist
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: übernimmt Platzmeldungen der Anlage als Sperren
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: unterbricht bei einer Störung den laufenden Auftrag
      - kind: unit
        file: packages/node-red-nodes/test/nodes.test.mjs
        test: wms-device-event meldet ein Geräte-Ereignis über den plcCode
      - kind: scenario
        id: material-flow
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Materialfluss: Konfiguration ansehen und Geräte-Ereignis im Probelauf senden"
    comparisons:
      openwms:
        status: abweichend
        note: Gleicher Zweck wie die OSIP-Telegramme (REQ_/RES_, LOCU, UPD_, ERR_), die in OpenWMS per AMQP oder REST ankommen; hier ein eigenes JSON-Format über REST. Zusätzlich Probelauf, Begründung und Meldung fehlender Routen statt stillem Verschlucken (R4). Systemstatus (SYSU) siehe Programm lock-group.
        refs:
          - Analyse 3.7 Workflows und Telegramme, Schwachstelle R4

  - id: materialfluss.node-red-programme
    title: Materialfluss-Programme in Node-RED
    group: materialfluss.betrieb
    summary: Überlässt besondere Entscheidungen einem Node-RED-Flow, der mit einem Fahrbefehl antwortet – ohne WMS-Code zu ändern.
    description: |
      Das Programm `node-red` sendet das Ereignis `flow.program-requested` mit dem Namen des Flows. Der Node-RED-Flow
      entscheidet und antwortet mit einem Fahrbefehl über die API. Ein Beispiel-Flow (`send-to-plc`) liegt bei.
    usage:
      - channel: node-red
        text: Flow hört auf `wms/flow/program-requested` und antwortet mit `POST /v1/flow/commands`.
      - channel: api
        text: "`POST /v1/flow/commands` mit `barcode`, `to`, optional `deviceId` und `reason`."
    dependsOn: [materialfluss.geraete-ereignisse]
    technical:
      components:
        - apps/api/src/modules/flow/application/flow.service.ts
        - flows/scripts/build-flows.mjs
      endpoints:
        - POST /v1/flow/commands
      events:
        emits: [flow.program-requested, flow.command]
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: übergibt an Node-RED, das per Fahrbefehl antwortet
      - kind: scenario
        id: material-flow
        note: Programm-Tab send-to-plc
    comparisons:
      openwms:
        status: abweichend
        note: Ersetzt eigene BPMN-Workflows durch Node-RED-Flows.
        refs:
          - Analyse 5.1a
          - Analyse 5.1c

  - id: materialfluss.entscheidungsprotokoll
    title: Materialfluss-Entscheidungen nachvollziehen
    group: materialfluss.betrieb
    summary: Zeigt zu jedem Geräte-Ereignis, welche Route und Action gefunden wurden und warum.
    description: Jede Verarbeitung wird mit Ergebnis (`COMMAND`, `FINISHED`, `HANDLED`, `DELEGATED`, `NO_ACTION`, `NO_NEXT_STEP`) und Begründung protokolliert, neueste zuerst.
    usage:
      - channel: api
        text: "`GET /v1/flow/decisions`"
      - channel: leitstand
        text: Seite **Materialfluss** – Entscheidungen, neueste zuerst.
    technical:
      components:
        - apps/api/src/modules/flow/entities/flow.entities.ts
      endpoints:
        - GET /v1/flow/decisions
      uiRoutes:
        - /materialfluss
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: fährt Schritt für Schritt und schließt bei Ankunft in der Zielgruppe ab
      - kind: scenario
        id: material-flow
    comparisons:
      openwms:
        status: neu
        note: Das TMS-Routing protokolliert keine Begründung je Ereignis.
        refs:
          - Analyse 3.7 Schwachstellen

  - id: materialfluss.simulator
    title: Anlagensimulator
    group: materialfluss.betrieb
    summary: Simuliert die Fördertechnik in Node-RED mit Fahrzeiten und Störungen – zum Testen und Vorführen ohne echte Anlage.
    description: |
      Der Simulator fährt auf jeden Fahrbefehl die TU mit konfigurierter Fahrzeit zum Ziel und meldet dort `request`
      oder `arrived`. Störungen lassen sich für die nächste Fahrt zu einem Platz einspeisen. Der Zustand mit den
      letzten Fahrten ist abrufbar.
    usage:
      - channel: node-red
        text: "Tab „Anlagensimulator“; `GET /sim/state`, `POST /sim/faults`, `DELETE /sim/faults` (Basic Auth `wms`)."
    settings:
      - name: Fahrzeiten und Ankunftsplätze
        description: "`defaultTravelMs`, `travelMs` je SPS-Code, `arrivedPatterns`."
        where: flows/simulator/config.json
      - name: Simulator an/aus
        description: "`SIMULATOR_ENABLED`"
        where: Umgebungsvariable (Compose)
    dependsOn: [materialfluss.geraete-ereignisse]
    technical:
      components:
        - flows/simulator/config.json
        - flows/scripts/build-flows.mjs
    evidence:
      - kind: scenario
        id: material-flow
    comparisons:
      openwms:
        status: neu
        note: Kein Anlagensimulator im öffentlichen OpenWMS.
        refs:
          - Analyse 5.1d

  - id: materialfluss.systemstatus
    title: Systemstatus für ganze Bereiche
    group: materialfluss.betrieb
    summary: Meldet die Anlage den Ausfall eines Bereichs, sperrt das WMS den ganzen Bereich für Ein- oder Auslagerung – und gibt ihn mit der Freimeldung wieder frei.
    description: |
      Das Programm `lock-group` der Action-Matrix übernimmt Sperren aus einer Zustands- oder Störungsmeldung für einen
      ganzen Lagerbereich: standardmäßig die Gruppe des meldenden Platzes, oder eine fest konfigurierte Gruppe. Die
      Sperre wirkt auf alle Untergruppen und Plätze und trägt Gerät, Code und Text als Grund.
    usage:
      - channel: api
        text: 'Action anlegen: `{ "eventType": "location-status", "place": { "group": "HRL" }, "program": "lock-group" }`; Meldung `{ "type": "location-status", "state": { "inbound": true }, "code": "SYSU" }`.'
      - channel: node-red
        text: Node `wms-device-event` mit Ereignis `location-status` oder `error`.
    settings:
      - name: Bereich und feste Sperren
        description: "`group` (sonst Gruppe des meldenden Platzes), `inbound`/`outbound` (sonst aus der Meldung)."
        where: Parameter der Action
    dependsOn: [materialfluss.action-matrix, lagerstruktur.sperren]
    technical:
      components:
        - apps/api/src/modules/flow/domain/programs.ts
        - apps/api/src/modules/flow/application/flow.service.ts
        - apps/api/src/modules/layout/application/location-group.service.ts
      events:
        emits: [location-group.lock-changed]
    evidence:
      - kind: integration
        file: apps/api/test/integration/flow.integration.test.ts
        test: sperrt per Systemstatus einen ganzen Bereich (Programm lock-group)
    comparisons:
      openwms:
        status: gleichwertig
        note: Entspricht dem Systemstatus-Telegramm SYSU, aus dessen Fehlercode OpenWMS den Gruppenstatus setzt (Workflow CP003); hier als Programm der Action-Matrix.
        refs:
          - Analyse 3.7 SYSU
