# Feature-Katalog – Bereich Auslagerung.
area: auslagerung

features:
  - id: auslagerung.auftrag
    title: Auslageraufträge anlegen
    group: auslagerung.auftraege
    summary: Erfasst Kundenaufträge mit Positionen in beliebigen Einheiten, Kunde, Priorität und Zielplatz für die Ware.
    description: |
      Ein Auslagerauftrag hat eine Auftragsnummer, optional Kunde und Priorität, ein Ziel (z. B. Versandplatz) und
      Positionen mit Produkt, Menge und optional Charge. Mengen werden in die Basiseinheit umgerechnet. Der
      Auftragszustand ergibt sich aus den Positionen.
    usage:
      - channel: leitstand
        text: Seite **Auslagerung** – Auftrag anlegen (Rolle leitstand).
      - channel: api
        text: '`POST /v1/outbound-orders` mit `orderId`, `customer?`, `customerCode?`, `shipTo?`, `priority?`, `target`, `lines`; lesen `GET …/{orderId}`, Liste `GET /v1/outbound-orders?state=…`.'
    rules:
      - Auftragsnummer eindeutig, Produkte und Einheiten müssen existieren.
      - Zustände Auftrag `CREATED` → `PARTIALLY_ALLOCATED` → `ALLOCATED` → `IN_PICKING` → `COMPLETED` (`CANCELLED`).
    dependsOn: [bestand.produktstamm, bestand.einheiten-umrechnung]
    technical:
      components:
        - apps/api/src/modules/outbound/application/outbound.service.ts
        - apps/api/src/modules/outbound/http/outbound.controller.ts
        - apps/web/src/pages/OutboundPage.tsx
      endpoints:
        - POST /v1/outbound-orders
        - GET /v1/outbound-orders/{orderId}
        - GET /v1/outbound-orders
      events:
        emits: [outbound-order.created]
      uiRoutes: [/auslagerung]
      notes:
        - Tabellen `outbound_order`, `outbound_line`, `outbound_pick`.
    evidence:
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: legt einen Auftrag an und prüft Produkt und Nummer
      - kind: web-e2e
        file: apps/web/e2e/leitstand.spec.ts
        test: "Auslagerauftrag: anlegen, zuteilen, quittieren"
      - kind: scenario
        id: outbound-flow
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: listet Aufträge, neueste zuerst, gefiltert nach Zustand
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Auslagerung, Kommissionierung und Versand liegen in OpenWMS in privaten Diensten (Picking, Shipping) und sind nicht einsehbar.
        refs:
          - Analyse 1.1

  - id: auslagerung.zuteilung
    title: Bestand zuteilen und reservieren
    group: auslagerung.auftraege
    summary: Wählt den passenden Bestand per Auslagerstrategie, reserviert ihn als Picks und meldet, was fehlt.
    description: |
      Die Zuteilung plant den offenen Bedarf jeder Position mit dem aktiven Auslager-Regelsatz (z. B. FEFO mit
      Mindestrestlaufzeit) und reserviert jede Entnahme als Pick. Sie ist mehrfach aufrufbar (Nachzuteilung). Auf
      Wunsch entsteht je TU eine Lagerbewegung oder ein Transportauftrag zum Ziel. Bei zu wenig Bestand wird zugeteilt,
      was geht, und die Fehlmenge gemeldet.
    usage:
      - channel: leitstand
        text: Seite **Auslagerung** – „Zuteilen“ am Auftrag.
      - channel: api
        text: '`POST /v1/outbound-orders/{orderId}/allocate` mit `transport`: `none` | `movement` | `transport-order`.'
    rules:
      - Kein Bestand von gesperrten Plätzen, gesperrten TUs oder aus laufender Inventur.
      - Gleichzeitige Zuteilungen vergeben nie mehr als verfügbar.
      - Ist eine TU schon belegt, wird das vermerkt statt doppelt beauftragt.
    dependsOn: [auslagerung.auftrag, strategien.auslagerstrategien, bestand.reservierung]
    technical:
      components:
        - apps/api/src/modules/outbound/application/outbound.service.ts
        - apps/api/src/modules/outbound/domain/outbound-rules.ts
      endpoints:
        - POST /v1/outbound-orders/{orderId}/allocate
      events:
        emits: [outbound-order.allocated, outbound-order.state-changed, allocation.decided, stock.reserved, movement.created, transport-order.created]
      uiRoutes: [/auslagerung]
    evidence:
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: teilt per FEFO mit Mindestrestlaufzeit zu und reserviert
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: teilt per FIFO über mehrere Posten zu
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: teilt bei zu wenig Bestand zu, was geht, und meldet die Fehlmenge
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: nimmt keinen Bestand von gesperrten Plätzen, gesperrten TUs oder aus laufender Inventur
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: legt je TU eine Lagerbewegung zum Ziel an
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: legt Transportaufträge an und vermerkt belegte TUs
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: vergibt bei gleichzeitigen Zuteilungen nie mehr als verfügbar
      - kind: web-e2e
        file: apps/web/e2e/leitstand.spec.ts
        test: "Auslagerauftrag: anlegen, zuteilen, quittieren"
      - kind: scenario
        id: outbound-flow
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Auslagerung, Kommissionierung und Versand liegen in OpenWMS in privaten Diensten (Picking, Shipping) und sind nicht einsehbar.
        refs:
          - Analyse 1.1

  - id: auslagerung.kommissionierung
    title: Picks quittieren und Fehlmengen behandeln
    group: auslagerung.kommissionierung
    summary: Bucht die Entnahme gegen die Reservierung; wird weniger gefunden, wird der Rest freigegeben und neu zuteilbar.
    description: |
      Die Quittung eines Picks bucht den Abgang gegen seine Reservierung. Wird weniger entnommen als zugeteilt, ist das
      eine Fehlmenge: der Rest wird freigegeben und kann neu zugeteilt werden. Sind alle Positionen entnommen, schließt
      der Auftrag automatisch. Die Pick-Arbeitsliste ist nach Platz sortiert.
    usage:
      - channel: leitstand
        text: Seite **Auslagerung** – Picks am Auftrag quittieren.
      - channel: api
        text: "`POST /v1/outbound-orders/{orderId}/picks/{pickId}/confirm` (`quantity?`, `pickedBy?`), Arbeitsliste `GET /v1/outbound-picks?state=OPEN`."
      - channel: scanner
        text: Ansicht **Picken** – Pick wählen, TU zur Kontrolle scannen, Menge bestätigen.
    rules:
      - Buchungen tragen den Bezug `outbound:<orderId>/<Position>`.
    dependsOn: [auslagerung.zuteilung, bestand.abgang]
    technical:
      components:
        - apps/api/src/modules/outbound/application/outbound.service.ts
      endpoints:
        - POST /v1/outbound-orders/{orderId}/picks/{pickId}/confirm
        - GET /v1/outbound-picks
      events:
        emits: [outbound-pick.confirmed, stock.issued, outbound-order.state-changed]
      uiRoutes: [/auslagerung, /scanner/*]
    evidence:
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: bucht bei der Quittung den Abgang und schließt den Auftrag
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: gibt bei einer Fehlmenge den Rest frei und teilt ihn neu zu
      - kind: web-e2e
        file: apps/web/e2e/leitstand.spec.ts
        test: "Auslagerauftrag: anlegen, zuteilen, quittieren"
      - kind: scenario
        id: outbound-flow
      - kind: web-e2e
        file: apps/web/e2e/scanner.spec.ts
        test: "Scanner: Pick quittieren mit TU-Kontrolle"
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Auslagerung, Kommissionierung und Versand liegen in OpenWMS in privaten Diensten (Picking, Shipping) und sind nicht einsehbar.
        refs:
          - Analyse 1.1

  - id: auslagerung.packen
    title: Am Packplatz auf Versand-TUs packen
    group: auslagerung.kommissionierung
    summary: Bucht die entnommene Ware bei der Quittung auf eine Versand-TU am Packplatz um, statt sie auszubuchen – ganze Paletten gehen unverändert in den Versand.
    description: |
      Wird beim Quittieren eine Versand-TU angegeben, wird die entnommene Menge aus der Reservierung auf diese TU
      umgebucht (Charge und MHD bleiben). Die Versand-TU muss am Ziel des Auftrags stehen, das als Packplatz dient.
      Ist die Versand-TU die Pick-TU selbst, wird die ganze Palette versendet; das geht nur, wenn der Pick den
      gesamten Posten umfasst. Der Pick merkt sich, wohin gepackt wurde.
    usage:
      - channel: leitstand
        text: Seite **Auslagerung** – im Auftrag „Packen auf Versand-TU“ ausfüllen und Picks quittieren.
      - channel: api
        text: "`POST /v1/outbound-orders/{orderId}/picks/{pickId}/confirm` mit `packInto`; der Pick liefert `packedInto`."
    rules:
      - Ohne Ziel am Auftrag → 409 `PACK_STATION_MISSING`; Versand-TU nicht am Packplatz → 409 `PACK_UNIT_NOT_AT_STATION`.
      - Ganze Palette nur vollständig (`PACK_IN_PLACE_PARTIAL`).
      - Buchungen `TRANSFER_OUT`/`TRANSFER_IN` mit dem Bezug `outbound:<orderId>/<Position>`.
    dependsOn: [auslagerung.kommissionierung, bestand.umbuchung]
    technical:
      components:
        - apps/api/src/modules/outbound/application/outbound.service.ts
        - apps/api/src/modules/inventory/application/inventory.service.ts
        - apps/web/src/pages/OutboundPage.tsx
      endpoints:
        - POST /v1/outbound-orders/{orderId}/picks/{pickId}/confirm
      events:
        emits: [outbound-pick.confirmed, stock.transferred, stock.reservation-released]
      uiRoutes: [/auslagerung]
      notes:
        - Spalte `packed_into` an `outbound_pick`.
    evidence:
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: lehnt Versand-TUs außerhalb des Packplatzes und Aufträge ohne Packplatz ab
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: bucht die entnommene Menge aus der Reservierung auf die Versand-TU um
      - kind: integration
        file: apps/api/test/integration/shipping.integration.test.ts
        test: versendet eine ganze Palette an Ort und Stelle, aber nur vollständig
      - kind: web-e2e
        file: apps/web/e2e/seiten.spec.ts
        test: "Versand: am Packplatz packen, mit Ladekontrolle verladen, Warenausgang buchen"
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Packen gehört in OpenWMS zum privaten Dienst Shipping.
        refs:
          - Analyse 1.1

  - id: auslagerung.abschluss
    title: Auslageraufträge abschließen oder stornieren
    group: auslagerung.auftraege
    summary: Schließt Aufträge mit Fehlmengen ab oder storniert sie – offene Reservierungen werden freigegeben.
    description: |
      Der Abschluss ist nur ohne offene Picks möglich; nicht gedeckte Positionen werden `SHORT`. Ein Storno gibt
      offene Picks frei; bereits Entnommenes bleibt gebucht. Beides ist endgültig.
    usage:
      - channel: leitstand
        text: Seite **Auslagerung** – Abschließen bzw. Stornieren.
      - channel: api
        text: "`POST /v1/outbound-orders/{orderId}/complete`, `…/cancel` (`reason?`)."
    dependsOn: [auslagerung.zuteilung]
    technical:
      components:
        - apps/api/src/modules/outbound/application/outbound.service.ts
        - apps/api/src/modules/outbound/domain/outbound-rules.ts
      endpoints:
        - POST /v1/outbound-orders/{orderId}/complete
        - POST /v1/outbound-orders/{orderId}/cancel
      events:
        emits: [outbound-order.state-changed, stock.reservation-released]
    evidence:
      - kind: integration
        file: apps/api/test/integration/outbound.integration.test.ts
        test: verlangt vor dem Abschluss quittierte Picks und gibt beim Storno alles frei
      - kind: unit
        file: apps/api/test/unit/outbound/outbound-rules.test.ts
        test: Storno und Abschluss sind endgültig
      - kind: scenario
        id: outbound-flow
    comparisons:
      openwms:
        status: nicht-einsehbar
        note: Auslagerung, Kommissionierung und Versand liegen in OpenWMS in privaten Diensten (Picking, Shipping) und sind nicht einsehbar.
        refs:
          - Analyse 1.1
