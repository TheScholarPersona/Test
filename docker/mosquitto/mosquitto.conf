# MQTT nur mit TLS und Anmeldung. Benutzer und Passwörter erzeugt start.sh
# beim Start aus der .env; Rechte je Topic stehen in acl.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence false
log_dest stdout
