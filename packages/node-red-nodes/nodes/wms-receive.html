<script type="text/html" data-help-name="wms-receive">
<p>Erfasst Ware im Wareneingang – gegen einen Auftrag (Avis) oder ohne Avis. Ohne TU-Barcode legt das WMS eine neue TU
des angegebenen Typs an. Alle Felder: Fester Wert oder <code>msg.…</code> (z. B. <code>msg.payload.barcode</code>); leere Charge/MHD werden weggelassen.</p>
<p>Überlieferung ohne Freigabe, unbekannte Einheit u. ä. kommen als Fehler (z. B. <code>OVERDELIVERY_NOT_ALLOWED</code>).</p>
<h3>Fehler</h3>
<p>Antwortet das WMS mit einem Fehler (z. B. <code>409 PLACEMENT_REJECTED</code>), steht er in <code>msg.wmsError</code>
(<code>code</code>, <code>message</code>, <code>statusCode</code>, <code>details</code>). Ohne <i>Fehlerausgang</i> ist er ein
Node-RED-Fehler, den ein <b>Catch</b>-Node abfängt; mit <i>Fehlerausgang</i> geht die Nachricht an Ausgang 2.</p>
</script>
