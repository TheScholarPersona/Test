<script type="text/html" data-help-name="wms-move-tu">
<p>Bewegt eine TU (samt Stapel) auf einen Platz, z. B. nach einem Scan. Alle Felder: Fester Wert oder <code>msg.…</code> (z. B. <code>msg.payload.barcode</code>).</p>
<p>Im Modus <i>geprüft</i> lehnt das WMS Regelverletzungen ab (Kapazität, Sperre, Platzierung); im Modus <i>physisch</i> bucht es und meldet sie.</p>
<h3>Fehler</h3>
<p>Antwortet das WMS mit einem Fehler (z. B. <code>409 PLACEMENT_REJECTED</code>), steht er in <code>msg.wmsError</code>
(<code>code</code>, <code>message</code>, <code>statusCode</code>, <code>details</code>). Ohne <i>Fehlerausgang</i> ist er ein
Node-RED-Fehler, den ein <b>Catch</b>-Node abfängt; mit <i>Fehlerausgang</i> geht die Nachricht an Ausgang 2.</p>
</script>
