name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typprüfung, Architektur, Unit- und Integrationstests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Node-RED-Flows sind aus dem Generator erzeugt
        run: |
          node flows/scripts/build-flows.mjs
          git diff --exit-code flows/node-red/flows.json
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - name: Unit-Tests (API und Node-RED-Nodes mit JUnit-Bericht für den Feature-Katalog)
        run: |
          pnpm --filter @wms/api test --reporter=default --reporter=junit --outputFile.junit=../../reports/api-unit-junit.xml
          pnpm --filter @wms/node-red-nodes test --reporter=default --reporter=junit --outputFile.junit=../../reports/nodes-unit-junit.xml
          pnpm -r --filter '!@wms/api' --filter '!@wms/node-red-nodes' test
      - name: Integrationstests (Testcontainers mit PostgreSQL und Mosquitto)
        run: pnpm test:integration --reporter=default --reporter=junit --outputFile.junit=../../reports/api-integration-junit.xml
      - name: Feature-Katalog statisch prüfen
        run: pnpm catalog:check
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-junit
          path: |
            reports/api-integration-junit.xml
            reports/api-unit-junit.xml
            reports/nodes-unit-junit.xml
          if-no-files-found: warn

  e2e:
    name: Node-RED-Szenarien gegen die vollständige Umgebung
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Geheimnisse für die Testumgebung erzeugen (.env)
        run: pnpm env:init
      - name: Umgebung starten (PostgreSQL, Mosquitto, API, Node-RED)
        run: docker compose up -d --build --wait
      - name: Szenarien ausführen
        run: pnpm test:e2e
        env:
          NODE_RED_URL: http://localhost:1880
      - name: Browser für die Oberflächen-Tests
        run: pnpm --filter @wms/web exec playwright install --with-deps chromium
      - name: Oberfläche im Browser testen (Playwright)
        run: pnpm --filter @wms/web test:e2e
      - name: Container-Protokolle bei Fehler
        if: failure()
        run: docker compose logs --no-color
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: |
            reports/e2e-junit.xml
            reports/web-e2e-junit.xml
          if-no-files-found: warn
      - name: Umgebung abbauen
        if: always()
        run: docker compose down -v

  catalog:
    name: Feature-Katalog gegen die Testergebnisse prüfen
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testberichte holen
        uses: actions/download-artifact@v4
        with:
          pattern: '*-junit'
          path: reports
          merge-multiple: true
      - name: Nachweise prüfen (jedes Katalog-Feature braucht bestandene Tests)
        run: pnpm catalog:check --reports reports
      - name: Katalogansicht erzeugen
        if: always()
        run: pnpm catalog:build --reports reports
      - name: Katalogansicht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-katalog
          path: catalog/dist
          if-no-files-found: warn
